/* v12: merged administrator header and role colors */
.admin-role-header{
  width:100%;
  min-height:104px;
  box-sizing:border-box;
  border-radius:24px;
  padding:18px 20px;
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:14px;
  color:#fff;
  margin-bottom:14px;
}
.admin-role-header.super-admin{
  background:#f59e0b;
  box-shadow:0 8px 22px rgba(245,158,11,.16);
}
.admin-role-header.officer-admin{
  background:#c9141b;
  box-shadow:0 8px 22px rgba(201,20,27,.14);
}
.admin-role-main{display:flex;align-items:center;gap:12px;min-width:0}
.admin-role-icon{
  width:44px;height:44px;border-radius:14px;
  background:rgba(255,255,255,.18);
  display:grid;place-items:center;flex:0 0 auto;
}
.admin-role-icon svg{width:24px;height:24px}
.admin-role-title{font-size:23px;line-height:1.15;font-weight:900}
.admin-role-user{font-size:13px;margin-top:5px;opacity:.92;overflow:hidden;text-overflow:ellipsis}
.admin-role-side{display:flex;align-items:center;gap:9px;flex:0 0 auto}
.admin-role-logout{
  width:40px;height:40px;border:1px solid rgba(255,255,255,.45);
  border-radius:12px;background:rgba(255,255,255,.12);
  color:#fff;display:grid;place-items:center;cursor:pointer;
}
.admin-role-logout:hover{background:rgba(255,255,255,.22)}
.admin-role-logout svg{width:20px;height:20px}
@media(max-width:430px){
  .admin-role-header{min-height:90px;padding:14px;border-radius:20px}
  .admin-role-title{font-size:20px}
  .admin-role-user{font-size:12px}
  .admin-role-icon{width:40px;height:40px}
  .admin-role-badge{font-size:11px;padding:0 9px}
  .admin-role-logout{width:38px;height:38px}
}


/* v13: announcement follows the same text-first section pattern as dashboard sections */
.announcement-admin{
  background:transparent;
  border:0;
  padding:0;
  margin:0 0 18px;
  box-shadow:none;
}
.announcement-simple{
  min-height:70px;
  box-sizing:border-box;
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:12px;
  padding:14px 16px;
  background:#fff;
  border:1px solid var(--line);
  border-radius:18px;
}
.announcement-text{
  min-width:0;
  flex:1;
  font-size:14px;
  line-height:1.6;
  color:var(--text);
  word-break:break-word;
}
.announcement-edit{
  flex:0 0 auto;
  min-height:40px;
  padding:0 12px;
  border:0;
  border-radius:12px;
  background:#fff0f0;
  color:var(--primary);
  font-size:13px;
  font-weight:850;
  display:inline-flex;
  align-items:center;
  justify-content:center;
  gap:6px;
  cursor:pointer;
}
.announcement-edit svg{width:17px;height:17px}
.announcement-edit-area textarea{
  width:100%;
  min-height:90px;
  box-sizing:border-box;
  border:1px solid var(--line);
  border-radius:14px;
  background:#fff;
  padding:12px;
  font:inherit;
  resize:vertical;
  outline:0;
}
.announcement-edit-area textarea:focus{
  border-color:var(--primary);
  box-shadow:0 0 0 2px rgba(201,20,27,.10);
}
@media(max-width:430px){
  .announcement-simple{padding:12px 13px}
  .announcement-edit{padding:0 10px}
}


/* ===== v16 CSS normalization ===== */
:root{
  --bg:#f5f5f3;
  --surface:#fff;
  --surface-2:#f0f0ed;
  --ink:#171717;
  --muted:#777;
  --line:#e7e7e3;
  --accent:#c9141b;
  --accent-soft:#fff0f0;
  --success:#22a35a;
  --warning:#e59a13;
  --danger:#b42318;
  --admin-super:#f59e0b;
  --radius:22px;
  --small-radius:14px;
  --btn-h:48px;
}

/* Header: admin access replaces the bell position. */
.top-admin-access{
  width:42px;height:42px;border-radius:14px;
  background:#fff;border:1px solid var(--line);
  color:var(--ink);display:grid;place-items:center;
  flex:0 0 auto;cursor:pointer;
}
.top-admin-access svg{width:21px;height:21px;color:var(--ink)}
.top-admin-access.super{color:var(--admin-super);border-color:#f2d39a}
.top-admin-access.super svg{color:var(--admin-super)}
.top-admin-access.officer{color:var(--accent);border-color:#efb8bb}
.top-admin-access.officer svg{color:var(--accent)}
.top-admin-access.guest{color:var(--ink)}
.top-admin-access.guest svg{color:var(--ink)}

/* One input rule for the whole system. */
input[type=text],
input[type=date],
input[type=password],
input[type=number],
select,
textarea,

function safeAdd(el,event,handler){
  if(el && typeof el.addEventListener==="function") el.addEventListener(event,handler);
  return el;
}
function safeAddById(id,event,handler){
  return safeAdd(document.getElementById(id),event,handler);
}
function safeOn(selector,event,handler,root=document){
  const el=root.querySelector(selector);
  if(el) el.addEventListener(event,handler);
  return el;
}
function uid(){
  if(window.crypto && typeof window.crypto.randomUUID === "function"){
    return window.crypto.randomUUID();
  }
  // UUID v4 fallback for older browsers
  return "xxxxxxxx-xxxx-4xxx-yxxx-xxxxxxxxxxxx".replace(/[xy]/g, function(c){
    const r = Math.random()*16|0, v = c === "x" ? r : (r&3|8);
    return v.toString(16);
  });
}
function norm(s){ return (s||"").trim().replace(/\s+/g," "); }
function keyOf(name){ return norm(name).toLowerCase(); }
function escapeHtml(s){
  return String(s).replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
}

      acts=(publicActs||[]).filter(a=>!a.publish_at || new Date(a.publish_at).getTime()<=Date.now());
    }

    state.activities=(acts||[]).map(a=>({

      createdBy:a.created_by||"",
      closeAt:a.close_at||null,
      autoCloseMinutes:a.auto_close_minutes==null?0:Number(a.auto_close_minutes),
      hidden:!!a.hidden,
      publishAt:a.publish_at||null
    }));

    state.registrations={};

    // 管理者使用安全 RPC；隊員頁只讀取公開簽到名單。

async function createActivityRemote(activity){
  const session=getAdminSession();
  if(!session) throw new Error("管理者登入已失效");

  const {data,error}=await supabaseClient.rpc("simple_admin_create_activity",{
    p_admin_username:session.username,
    p_admin_code:session.access_code,
    p_id:activity.id,
    p_name:activity.name,
    p_date:activity.date,
    p_fields:activity.fields,
    p_open:activity.open,
    p_max_participants:activity.maxParticipants,
    p_created_by:activity.createdBy||session.username,
    p_close_at:activity.closeAt,
    p_auto_close_minutes:activity.autoCloseMinutes||0,
    p_hidden:!!activity.hidden,
    p_publish_at:activity.publishAt||null
  });
  if(error) throw error;
  if(!data?.ok) throw new Error(data?.message||"建立活動失敗");

  // 相容舊／新 SQL 回傳格式：
  // 舊版可能回傳 data.activity；部分 SQL 只回傳 data.id。
  // 前端不能直接讀 undefined.id，因此永遠整理成完整 activity。
  const raw=data.activity || data;
  return {
    ...activity,
    ...(raw && typeof raw === "object" ? raw : {}),
    id: raw?.id || activity.id,
    name: raw?.name ?? activity.name,
    date: raw?.date ?? activity.date,
    fields: Array.isArray(raw?.fields) ? raw.fields : activity.fields,
    open: typeof raw?.open === "boolean" ? raw.open : activity.open,
    maxParticipants: raw?.max_participants !== undefined
      ? (raw.max_participants == null ? null : Number(raw.max_participants))
      : (raw?.maxParticipants !== undefined ? raw.maxParticipants : activity.maxParticipants),
    createdBy: raw?.created_by ?? raw?.createdBy ?? activity.createdBy,
    closeAt: raw?.close_at ?? raw?.closeAt ?? activity.closeAt,
    autoCloseMinutes: raw?.auto_close_minutes !== undefined
      ? Number(raw.auto_close_minutes || 0)
      : Number(raw?.autoCloseMinutes ?? activity.autoCloseMinutes ?? 0),
    hidden: typeof raw?.hidden === "boolean" ? raw.hidden : activity.hidden,
    publishAt: raw?.publish_at ?? raw?.publishAt ?? activity.publishAt ?? null
  };
}

async function createRegistrationRemote(activityId, registration){
  // 隊員簽到改走公開 RPC。
  // 不直接 INSERT registrations，避免被 Supabase RLS 擋住。
  const { data, error } = await supabaseClient.rpc("public_create_registration", {
    p_activity_id: activityId,
    p_name: registration.name,
    p_field_values: registration.fieldValues || {}
  });

  if(error) throw error;

  if(!data?.ok){
    throw new Error(data?.message || "簽到失敗");
  }

  return data.registration || data;
}

async function deleteRegistrationRemote(registrationId){
  // 直接刪除後必須確認資料庫真的消失。
  const direct=await supabaseClient.from("registrations").delete().eq("id",registrationId);
  if(!direct.error){
    const verify=await supabaseClient.from("registrations")
      .select("id").eq("id",registrationId).maybeSingle();
    if(!verify.error && !verify.data) return true;
  }

  console.warn("直接刪除未確認成功，嘗試公開刪除 RPC：",direct.error);

  const rpc=await supabaseClient.rpc("public_delete_registration",{
    p_registration_id:registrationId
  });

  if(rpc.error) throw rpc.error;
  if(rpc.data && rpc.data.ok===false){
    throw new Error(rpc.data.message||"刪除簽到失敗");
  }

  const verify2=await supabaseClient.from("registrations")
    .select("id").eq("id",registrationId).maybeSingle();
  if(verify2.error) throw verify2.error;
  if(verify2.data) throw new Error("資料庫仍存在這筆簽到紀錄");

  return true;
}

const SIGNED_LOCAL_KEY="haotian_signed_names_v1";
function getLocalSignedMap(){
  try{return JSON.parse(localStorage.getItem(SIGNED_LOCAL_KEY)||"{}")||{};}
  catch(e){return {};}
}
function hasLocalSigned(activityId,name){
  const map=getLocalSignedMap();
  const arr=Array.isArray(map[activityId])?map[activityId]:[];
  return arr.some(n=>keyOf(n)===keyOf(name));
}
function rememberLocalSigned(activityId,name){
  const map=getLocalSignedMap();
  if(!Array.isArray(map[activityId])) map[activityId]=[];
  if(!map[activityId].some(n=>keyOf(n)===keyOf(name))) map[activityId].push(norm(name));
  localStorage.setItem(SIGNED_LOCAL_KEY,JSON.stringify(map));
}
function forgetLocalSigned(activityId,name){
  const map=getLocalSignedMap();
  if(Array.isArray(map[activityId])){
    map[activityId]=map[activityId].filter(n=>keyOf(n)!==keyOf(name));
    localStorage.setItem(SIGNED_LOCAL_KEY,JSON.stringify(map));
  }
}

function regsOf(activityId){ return state.registrations[activityId] || (state.registrations[activityId] = []); }

function filledCount(activity){
  const list = regsOf(activity.id);
  // count registrants who filled in at least one field with a non-empty value
  return list.filter(r => (activity.fields||[]).some(f => norm((r.fieldValues||{})[f.key]) !== "")).length;
}

function allKnownNames(){
  const set = new Set();
  Object.values(state.registrations).forEach(list=>{
    (list||[]).forEach(r => set.add(norm(r.name)));
  });
  return Array.from(set).sort((a,b)=> a.localeCompare(b,'zh-Hant'));
}

function activitiesThisYear(){
  const y = new Date().getFullYear();
  const now = Date.now();

  // 「未發布」活動不納入查詢／出席率計算。
  // publishAt 為 null 代表立即發布；只有發布時間尚未到的活動才排除。
  return state.activities.filter(a => {
    if(new Date(a.date).getFullYear() !== y) return false;

    const publishTs = a.publishAt ? new Date(a.publishAt).getTime() : null;
    if(Number.isFinite(publishTs) && publishTs > now) return false;

    return true;
  });
}

function recentOrOpenActivities(){
  const sevenDaysAgo = Date.now() - 7*24*60*60*1000;
  return state.activities.filter(a=>{
    if(a.hidden) return false;
    const ts = a.publishAt ? new Date(a.publishAt).getTime() : null;
    if(Number.isFinite(ts) && ts > Date.now()) return false;
    return a.open || new Date(a.date).getTime() >= sevenDaysAgo;
  });
}

function annualStats(name){
  const k = keyOf(name);
  const acts = activitiesThisYear();
  let attended = 0;
  const detail = acts.map(a=>{
    const present = regsOf(a.id).some(r => keyOf(r.name) === k);
    if(present) attended++;
    return { activity: a, present };
  });
  const total = acts.length;
  const rate = total === 0 ? 0 : Math.round((attended/total)*1000)/10;
  return { attended, total, rate, detail };
}

function exportAnnualCSV(rows, year){
  const escapeCsv = (v)=>{
    const s=String(v);
    return /[",\n]/.test(s) ? '"' + s.replace(/"/g,'""') + '"' : s;
  };
  let csv="\uFEFF"+["姓名","參加場次","總場次","出席率(%)"].join(",")+"\n";
  rows.forEach(r=>{
    csv += [escapeCsv(r.name),r.attended,r.total,r.rate].join(",")+"\n";
  });
  const blob=new Blob([csv],{type:"text/csv;charset=utf-8;"});
  const url=URL.createObjectURL(blob);
  const a=document.createElement("a");
  a.href=url;
  a.download=`年度出席率總表_${year}.csv`;
  document.body.appendChild(a);
  a.click();
  document.body.removeChild(a);
  URL.revokeObjectURL(url);
}

function getPublishAt(){
  if(publishMode === "1day") return new Date(Date.now()+24*60*60*1000).toISOString();
  if(publishMode === "1week") return new Date(Date.now()+7*24*60*60*1000).toISOString();
  return null;
}

function formatCountdown(ms){
  const s=Math.max(0,Math.floor(ms/1000)),d=Math.floor(s/86400),h=Math.floor(s%86400/3600),m=Math.floor(s%3600/60),sec=s%60;
  return (d?d+"天 ":"")+String(h).padStart(2,"0")+":"+String(m).padStart(2,"0")+":"+String(sec).padStart(2,"0");
}
function renderCountdown(activity){
  const box=document.getElementById("event-countdown");if(!box)return;
  const timer=()=>{
    const now=Date.now(), end=activity.closeAt?new Date(activity.closeAt).getTime():null;
    if(end&&end>now){
      box.classList.add("has-countdown");
      box.classList.remove("no-countdown");
      box.innerHTML=`<i data-lucide="timer"></i><span>${formatCountdown(end-now)}</span>`;
      refreshIcons();
    }else{
      box.classList.remove("has-countdown");
      box.classList.add("no-countdown");
      box.innerHTML=`<i data-lucide="timer-off"></i>`;
      refreshIcons();
    }
  };
  timer(); clearInterval(activity._countdownTimer); activity._countdownTimer=setInterval(timer,1000);
}

async function refreshActivityRegistrations(activityId){
  const {data,error}=await supabaseClient
    .from("registrations")
    .select("id,activity_id,name,field_values,created_at")
    .eq("activity_id",activityId)
    .order("created_at",{ascending:true});
  if(error) throw error;

  const fresh=(data||[]).map(r=>({
    id:r.id,
    activity_id:r.activity_id,
    name:r.name,
    fieldValues:r.field_values||{},
    ts:r.created_at
  }));
  state.registrations[activityId]=fresh;
  return fresh;
}

function getAttendanceTone(rate){
  const n=Number(rate)||0;
  if(n<=10) return {name:'red',color:'#d62828',label:'需要加油'};
  if(n<60) return {name:'orange',color:'#f59e0b',label:'持續努力'};
  if(n<90) return {name:'green',color:'#22a35a',label:'表現良好'};
  return {name:'gold',color:'#d99a00',label:'表現優異'};
}

async function loadAnnouncementRemote(){
  const {data,error}=await supabaseClient.rpc("get_announcement");

}
async function saveAnnouncementRemote(text){
  const {data,error}=await supabaseClient.rpc("save_announcement",{p_announcement:text});

  announcementText=text;
  return true;
}

function activityAdminRow(a,hidden=false){
  const list=regsOf(a.id);
  const expanded=window.adminAttendanceExpandedId===a.id;
  const future=a.publishAt&&Number.isFinite(new Date(a.publishAt).getTime())&&new Date(a.publishAt).getTime()>Date.now();
  let detail="";
  if(expanded){
    const rows=list.map((r,i)=>{
      const fieldCells=(a.fields||[]).map(f=>`<td>${r.fieldValues&&r.fieldValues[f.key]?escapeHtml(r.fieldValues[f.key]):"—"}</td>`).join("");
      return `<tr><td>${i+1}</td><td class="name">${escapeHtml(r.name)}</td>${fieldCells}<td>${r.ts?new Date(r.ts).toLocaleString("zh-TW",{hour12:false}):"—"}</td></tr>`;
    }).join("");
    const headers=(a.fields||[]).map(f=>`<th>${escapeHtml(f.label)}</th>`).join("");
    detail=`<div class="divider"></div><div style="font-weight:850;font-size:13px;margin-bottom:8px">簽到者名單（${list.length} 人）</div>${list.length?`<div class="table-wrap"><table class="list-table"><thead><tr><th>#</th><th>姓名</th>${headers}<th>時間</th></tr></thead><tbody>${rows}</tbody></table></div>`:`<div class="empty" style="padding:14px">目前還沒有人簽到</div>`}`;
  }
  const statusClass=future?"future":(a.open?"open":"closed");
  const statusText=future?"未發布":(a.open?"開放中":"已停止");
  return `<div class="activity-admin-card ${hidden?"hidden":""}" data-admin-activity-row="${escapeHtml(a.id)}"><div class="admin-card-top"><div class="admin-card-icon"><i data-lucide="calendar-days"></i></div><div class="admin-card-info"><div class="admin-card-name">${escapeHtml(a.name)}</div><div class="admin-card-meta">${fmtDate(a.date)} · 建立者：${escapeHtml(a.createdBy||"—")}</div><div class="admin-card-status"><span class="status ${statusClass}"><span class="dot"></span>${statusText}</span>${hidden?` <span class="status closed"><i data-lucide="eye-off"></i> 已隱藏</span>`:""}</div></div><div style="font-size:12px;font-weight:850">${list.length}${a.maxParticipants?` / ${a.maxParticipants}`:""}</div></div><div class="stat-row"><span><b>${list.length}</b> 人簽到</span><span>${a.maxParticipants?`上限 ${a.maxParticipants} 人`:"無人數限制"}</span></div><div class="admin-actions"><button data-admin-attendance="${escapeHtml(a.id)}"><i data-lucide="users"></i>${expanded?"收起名單":`名單 ${list.length}`}</button><button data-activity-close="${escapeHtml(a.id)}"><i data-lucide="power"></i>${a.open?"關閉":"開啟"}</button><button data-activity-hide="${escapeHtml(a.id)}"><i data-lucide="${hidden?"eye":"eye-off"}"></i>${hidden?"取消隱藏":"隱藏"}</button><button class="danger" data-activity-delete="${escapeHtml(a.id)}"><i data-lucide="trash-2"></i>刪除</button></div>${detail}</div>`;
}

function rememberCreateDraft(){
  const n=document.getElementById("new-name");
  const d=document.getElementById("new-date");
  const m=document.getElementById("new-max-participants");
  if(n) draftName=n.value;
  if(d) draftDate=d.value;
  if(m) draftMaxParticipants=m.value;
  document.querySelectorAll(".draft-field-input").forEach(inp=>{
    const i=Number(inp.dataset.idx);
    if(Number.isFinite(i)) draftFields[i]=inp.value;
  });
}
function setupCreateActivityPage(el){
  function syncDraftFieldsFromDom(){
    draftName=document.getElementById("new-name")?.value||"";
    draftDate=document.getElementById("new-date")?.value||"";
    const max=document.getElementById("new-max-participants");
    draftMaxParticipants=max?max.value:"";
    document.querySelectorAll(".draft-field-input").forEach(inp=>draftFields[Number(inp.dataset.idx)]=inp.value);
  }

  ["new-name","new-date","new-max-participants"].forEach(id=>{
    const input=document.getElementById(id);
    if(input){
      input.addEventListener("input",rememberCreateDraft);
      input.addEventListener("change",rememberCreateDraft);
    }
  });
  el.querySelectorAll(".draft-field-input").forEach(input=>{
    input.addEventListener("input",rememberCreateDraft);
    input.addEventListener("change",rememberCreateDraft);
  });

  const addFieldBtn=document.getElementById("add-field-btn"); if(addFieldBtn) addFieldBtn.onclick=()=>{
    syncDraftFieldsFromDom(); draftFields.push(""); renderAdmin(el);
  };
  el.querySelectorAll("[data-remove-field]").forEach(btn=>{
    btn.onclick=()=>{syncDraftFieldsFromDom();draftFields.splice(Number(btn.dataset.removeField),1);renderAdmin(el);};
  });
  el.querySelectorAll("[data-timer]").forEach(btn=>{
    btn.onclick=(ev)=>{
      ev.preventDefault();
      ev.stopPropagation();
      draftCloseMinutes=Number(btn.dataset.timer || 0);
      el.querySelectorAll("[data-timer]").forEach(b=>{
        b.classList.toggle("selected", Number(b.dataset.timer||0)===draftCloseMinutes);
      });
    };
  });
  el.querySelectorAll(".publish-choice").forEach(btn=>{
    btn.onclick=(ev)=>{
      ev.preventDefault();
      ev.stopPropagation();
      publishMode=btn.dataset.publishMode || "now";
      el.querySelectorAll(".publish-choice").forEach(b=>b.classList.toggle("selected",b===btn));
      rememberCreateDraft();
    };
  });

  const createBtn=document.getElementById("create-btn"); if(createBtn) createBtn.onclick=async()=>{
    const createBtn=document.getElementById("create-btn"), errBox=document.getElementById("create-activity-error");
    syncDraftFieldsFromDom();
    const name=norm(draftName), maxRaw=(document.getElementById("new-max-participants")?.value||"").trim();
    const maxParticipants=maxRaw===""?null:Number(maxRaw), closeMinutes=Number(draftCloseMinutes||0);
    const publishAt =
      publishMode==="1day" ? new Date(Date.now()+24*60*60*1000).toISOString() :
      publishMode==="1week" ? new Date(Date.now()+7*24*60*60*1000).toISOString() :
      null;
    if(!name){showToast("請輸入活動名稱");return;}
    if(maxParticipants!==null&&(!Number.isInteger(maxParticipants)||maxParticipants<1)){showToast("人數限制請輸入 1 以上整數");return;}
    const date=draftDate?new Date(draftDate).toISOString():new Date().toISOString();
    const fields=draftFields.map(l=>norm(l)).filter(Boolean).map(label=>({key:uid(),label}));
    const session=getAdminSession();
    const activity={id:uid(),name,date,fields,open:true,maxParticipants,createdBy:session?.username||"",closeAt:closeMinutes?new Date(Date.now()+closeMinutes*60000).toISOString():null,autoCloseMinutes:closeMinutes,hidden:false,publishAt:publishAt};
    createBtn.disabled=true;
    try{
      const saved=await createActivityRemote(activity);
      state.activities.push({
        ...activity,
        ...(saved || {}),
        id:saved?.id||activity.id,
        publishAt:saved?.publish_at ?? saved?.publishAt ?? activity.publishAt ?? null
      });
      state.registrations[activity.id]=[];
      pendingPublishActivity=null;
      showToast(publishAt ? "活動已建立，尚未發布" : "活動已建立並發布");
      adminPage="activities";
      renderAdmin(el);
    }catch(e){
      const msg=[e?.message,e?.code,e?.details,e?.hint].filter(Boolean).join(" | ");
      if(errBox){errBox.textContent="建立活動失敗："+(msg||"未知錯誤");errBox.classList.add("show");}
      showToast("建立活動失敗","error");createBtn.disabled=false;
    }
  };
}

function setupActivityManagementPage(el){
  // 活動管理：查看／隱藏簽到名單
  el.querySelectorAll("[data-admin-attendance]").forEach(btn=>{
    btn.onclick=async(ev)=>{
      ev.preventDefault();
      ev.stopPropagation();
      const id=btn.getAttribute("data-admin-attendance");
      window.adminAttendanceExpandedId =
        window.adminAttendanceExpandedId===id ? null : id;

      // 若目前 state 沒有該活動的簽到資料，重新載入一次。
      const a=state.activities.find(x=>String(x.id)===String(id));
      if(a && (!state.registrations[a.id] || state.registrations[a.id].length===0)){
        try{
          await loadData();
        }catch(e){
          console.error("讀取簽到名單失敗",e);
        }
      }
      renderAdmin(el);
    };
  });

  // 活動管理：直接對「目前畫面上的按鈕」綁定 onclick。
  // 不再依賴事件委派，避免被其他 DOM 事件攔截。
  const buttons = el.querySelectorAll(
    "[data-activity-close],[data-activity-hide],[data-activity-delete]"
  );

  buttons.forEach(btn=>{
    btn.disabled=false;

    btn.onclick = async function(ev){
      ev.preventDefault();
      ev.stopImmediatePropagation();
      ev.stopPropagation();

      const id =
        this.getAttribute("data-activity-close") ||
        this.getAttribute("data-activity-hide") ||
        this.getAttribute("data-activity-delete");

      const a = state.activities.find(x=>String(x.id)===String(id));

      if(!a){
        showToast("找不到這個活動，請重新整理資料","error");
        console.error("活動不存在，id=",id,"activities=",state.activities);
        return;
      }

      const isClose=this.hasAttribute("data-activity-close");
      const isHide=this.hasAttribute("data-activity-hide");
      const isDelete=this.hasAttribute("data-activity-delete");

      if(isClose){
        const next=!a.open;
        const action=next?"開啟":"關閉";

        if(!confirm(`確定${action}「${a.name}」？`)) return;

        this.disabled=true;

        try{
          // 明確建立完整 payload，避免 update 時遺漏 hidden/publishAt 等欄位。
          const payload={
            id:a.id,
            name:a.name,
            date:a.date,
            fields:a.fields||[],
            open:next,
            maxParticipants:a.maxParticipants==null?null:a.maxParticipants,
            createdBy:a.createdBy||"",
            closeAt:a.closeAt||null,
            autoCloseMinutes:a.autoCloseMinutes||0,
            hidden:!!a.hidden,
            publishAt:a.publishAt||null
          };

          console.log("活動開關更新:",payload);
          await updateActivityRemote(payload);

          a.open=next;
          showToast(next?"活動已開啟":"活動已關閉");

          // 重新讀取資料庫，確保畫面與資料庫一致。
          await loadData();
          renderAdmin(el);
        }catch(err){
          console.error("活動開關失敗:",err);
          this.disabled=false;
          showToast("活動更新失敗："+(err?.message||"未知錯誤"),"error");
        }
        return;
      }

      if(isHide){
        const next=!a.hidden;
        const action=next?"隱藏":"取消隱藏";

        if(!confirm(next
          ? `確定隱藏「${a.name}」？\n隊員活動列表將不再顯示。`
          : `確定取消隱藏「${a.name}」？`
        )) return;

        this.disabled=true;

        try{
          const payload={
            id:a.id,
            name:a.name,
            date:a.date,
            fields:a.fields||[],
            open:!!a.open,
            maxParticipants:a.maxParticipants==null?null:a.maxParticipants,
            createdBy:a.createdBy||"",
            closeAt:a.closeAt||null,
            autoCloseMinutes:a.autoCloseMinutes||0,
            hidden:next,
            publishAt:a.publishAt||null
          };

          console.log("活動隱藏更新:",payload);
          await updateActivityRemote(payload);

          a.hidden=next;
          showToast(next?"活動已隱藏":"已取消隱藏");

          await loadData();
          renderAdmin(el);
        }catch(err){
          console.error("活動隱藏失敗:",err);
          this.disabled=false;
          showToast("隱藏狀態更新失敗："+(err?.message||"未知錯誤"),"error");
        }
        return;
      }

      if(isDelete){
        if(!confirm(
          `確定永久刪除「${a.name}」？\n`+
          `此活動的簽到資料也會刪除，無法復原。`
        )) return;

        this.disabled=true;

        try{
          console.log("刪除活動:",a.id);
          await deleteActivityRemote(a.id);

          state.activities=state.activities.filter(
            x=>String(x.id)!==String(a.id)
          );
          delete state.registrations[a.id];

          if(adminExpandedId===a.id) adminExpandedId=null;

          showToast("活動已刪除");

          await loadData();
          renderAdmin(el);
        }catch(err){
          console.error("活動刪除失敗:",err);
          this.disabled=false;
          showToast(
            "刪除失敗："+(err?.message||"請確認 Supabase 權限"),
            "error"
          );
        }
      }
    };
  });

  console.log("活動管理按鈕已綁定，共",buttons.length,"個");
}

function renderAdminLock(el){
  el.innerHTML=`<div class="card" style="text-align:center;">
    <div class="lock-icon"><i data-lucide="lock-keyhole"></i></div><h2>管理者登入</h2>
    
    <input type="text" id="admin-username" placeholder="帳號" autocomplete="username">
    <input type="password" id="admin-password" placeholder="密碼" autocomplete="current-password">
    <button class="primary" id="admin-login-btn">登入管理者</button>
  </div>`;
  const b=document.getElementById("admin-login-btn"),u=document.getElementById("admin-username"),p=document.getElementById("admin-password");
  const login=async()=>{
    if(!norm(u.value)){showToast("請輸入帳號");return;}
    if(!p.value){showToast("請輸入密碼");return;}
    b.disabled=true;
    try{await adminLogin(norm(u.value),p.value);showToast("登入成功");render();}
    catch(e){showToast("登入失敗："+(e?.message||"帳號或密碼錯誤"));b.disabled=false;}
  };
  if(b) b.onclick=login;
  refreshIcons();
  [u,p].filter(Boolean).forEach(x=>safeAdd(x,"keydown",e=>{if(e.key==="Enter")login();}));
}

async function init(){
  render();
  await checkAdminSession();
  await loadData();
  try{ await loadAnnouncementRemote(); }
  catch(e){ console.error("公告載入失敗",e); }
  render();
  setInterval(async ()=>{
    if(userIsTyping || activeTab === 'query') return;

    // 自動關閉計時器：到時間後將活動設為停止簽到
    const now = Date.now();
    const expired = state.activities.filter(a => a.open && a.closeAt && new Date(a.closeAt).getTime() <= now);

    for(const a of expired){
      try{
        a.open = false;
        await updateActivityRemote(a);
      }catch(e){
        console.error("活動自動關閉失敗", e);
        a.open = true;
      }
    }

    if(activeTab !== "admin"){
      await loadData();
      if(!userIsTyping) renderTab();
    }else if(!userIsTyping){
      // 管理者頁面不重繪，避免建立活動中的輸入資料被清空。
      await loadData();
    }
  },6000);
}

init();

 var b=document.getElementById("runtime-debug"),x=document.getElementById("runtime-debug-text");
 if(b&&x){b.style.display="block";x.textContent=title+"："+String(reason&&reason.message||reason||"未知錯誤")+(reason&&reason.stack?"\n\n"+reason.stack:"");}

<script>
/* ===== 活動管理最終除錯層 ===== */
(function(){
  async function activityButtonHandler(ev){
    const btn=ev.target && ev.target.closest &&
      ev.target.closest("[data-activity-close],[data-activity-hide],[data-activity-delete]");
    if(!btn) return;
    ev.preventDefault();
    ev.stopPropagation();

    const id=btn.getAttribute("data-activity-close") ||
             btn.getAttribute("data-activity-hide") ||
             btn.getAttribute("data-activity-delete");

    console.log("[活動管理] 按鈕被點擊", {
      id:id,
      close:btn.getAttribute("data-activity-close"),
      hide:btn.getAttribute("data-activity-hide"),
      delete:btn.getAttribute("data-activity-delete")
    });

    let a=(window.state && Array.isArray(state.activities))
      ? state.activities.find(x=>String(x.id)===String(id))
      : null;

    // state 可能因頁面重繪尚未同步；直接以按鈕上的 UUID 查資料庫。
    if(!a){
      try{
        const {data:remoteActivity,error:remoteError}=await supabaseClient
          .from("activities")
          .select("*")
          .eq("id",id)
          .maybeSingle();

        if(remoteError) throw remoteError;

        if(remoteActivity){
          a={
            id:remoteActivity.id,
            name:remoteActivity.name,
            date:remoteActivity.date,
            fields:Array.isArray(remoteActivity.fields)?remoteActivity.fields:[],
            open:!!remoteActivity.open,
            maxParticipants:remoteActivity.max_participants==null?null:Number(remoteActivity.max_participants),
            createdBy:remoteActivity.created_by||"",
            closeAt:remoteActivity.close_at||null,
            autoCloseMinutes:remoteActivity.auto_close_minutes==null?0:Number(remoteActivity.auto_close_minutes),
            hidden:!!remoteActivity.hidden,
            publishAt:remoteActivity.publish_at||null
          };

          if(window.state){
            window.state.activities=Array.isArray(window.state.activities)?window.state.activities:[];
            const idx=window.state.activities.findIndex(x=>String(x.id)===String(id));
            if(idx>=0) window.state.activities[idx]=a;
            else window.state.activities.push(a);
          }
        }
      }catch(dbErr){
        console.error("[活動管理] 直接查詢活動失敗",dbErr);
        window.showToast("讀取活動失敗："+(dbErr.message||dbErr),"error");
        return;
      }
    }

    if(!a){
      window.showToast("資料庫找不到此活動："+id,"error");
      console.error("[活動管理] 資料庫也找不到活動",id);
      return;
    }

    if(btn.hasAttribute("data-activity-close")){
      activityActionClose(a,btn);
    }else if(btn.hasAttribute("data-activity-hide")){
      activityActionHide(a,btn);
    }else{
      activityActionDelete(a,btn);
    }
  }

  async function activityActionClose(a,btn){
    const next=!a.open;
    if(!confirm(next?"確定開啟「"+a.name+"」？":"確定關閉「"+a.name+"」？")) return;
    btn.disabled=true;
    const old=a.open;
    a.open=next;
    try{
      await window.updateActivityRemote(a);
      window.showToast(next?"活動已開啟":"活動已關閉");
      await window.loadData();
      if(typeof renderAdmin==="function") window.renderAdmin(document.getElementById("tab-content"));
    }catch(e){
      a.open=old;
      console.error("[活動管理] 開啟/關閉失敗",e);
      window.showToast("活動更新失敗："+(e.message||e),"error");
      btn.disabled=false;
    }
  }

  async function activityActionHide(a,btn){
    const next=!a.hidden;
    if(!confirm(next?"確定隱藏「"+a.name+"」？":"確定取消隱藏「"+a.name+"」？")) return;
    btn.disabled=true;
    const old=!!a.hidden;
    a.hidden=next;
    try{
      await window.updateActivityRemote(a);
      window.showToast(next?"活動已隱藏":"已取消隱藏");
      await window.loadData();
      if(typeof renderAdmin==="function") window.renderAdmin(document.getElementById("tab-content"));
    }catch(e){
      a.hidden=old;
      console.error("[活動管理] 隱藏失敗",e);
      window.showToast("隱藏更新失敗："+(e.message||e),"error");
      btn.disabled=false;
    }
  }

  async function activityActionDelete(a,btn){
    if(!confirm("確定永久刪除「"+a.name+"」？\n此活動的簽到資料也會刪除，無法復原。")) return;
    btn.disabled=true;
    try{
      await window.deleteActivityRemote(a.id);
      window.state.activities=window.state.activities.filter(x=>String(x.id)!==String(a.id));
      delete window.state.registrations[a.id];
      window.showToast("活動已刪除");
      await window.loadData();
      if(typeof renderAdmin==="function") window.renderAdmin(document.getElementById("tab-content"));
    }catch(e){
      console.error("[活動管理] 刪除失敗",e);
      window.showToast("刪除失敗："+(e.message||e),"error");
      btn.disabled=false;
    }
  }

  // capture=true：在任何其他 click handler 前攔截活動按鈕。
  document.addEventListener("click",activityButtonHandler,true);
})();
</script>
