<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex, nofollow, noarchive">
<title>台中浩天宮四紅哨角隊 活動簽到簿</title>
<style>
  :root{
    --bg:#FBF1E2;
    --surface:#FFFFFF;
    --ink:#3B2416;
    --ink-soft:#8C6B4E;
    --accent:#D8531B;
    --accent-soft:#F8DCC5;
    --warn:#E2A227;
    --warn-soft:#FBEAC4;
    --absent:#9C2B1D;
    --absent-soft:#F3D9D0;
    --line:#EAD9C1;
    --radius:14px;
  }
  *{box-sizing:border-box;}
  body{
    margin:0;
    background:var(--bg);
    color:var(--ink);
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang TC","Microsoft JhengHei",sans-serif;
    -webkit-font-smoothing:antialiased;
  }
  #app{ max-width:520px; margin:0 auto; padding:16px 16px 40px; }
  header.top{ padding:18px 4px 14px; text-align:center; }
  header.top .eyebrow{ font-size:12px; letter-spacing:.12em; text-transform:uppercase; color:var(--ink-soft); font-weight:600; }
  header.top h1{ margin:4px 0 0; font-size:24px; font-weight:800; letter-spacing:-0.01em; }
  nav.tabs{ display:flex; gap:6px; background:var(--surface); border-radius:999px; padding:5px; border:1px solid var(--line); margin-bottom:18px; }
  nav.tabs button{ flex:1; border:none; background:transparent; padding:10px 8px; border-radius:999px; font-size:14px; font-weight:600; color:var(--ink-soft); cursor:pointer; font-family:inherit; transition:background .15s ease, color .15s ease; }
  nav.tabs button.active{ background:var(--ink); color:#fff; }
  .card{ background:var(--surface); border-radius:var(--radius); border:1px solid var(--line); padding:18px; margin-bottom:14px; }
  .card h2{ margin:0 0 4px; font-size:16px; font-weight:800; }
  .card p.hint{ margin:0 0 14px; font-size:13px; color:var(--ink-soft); line-height:1.5; }
  input[type=text], input[type=date], input[type=password], select{
    width:100%; padding:12px 14px; border-radius:10px; border:1.5px solid var(--line);
    font-size:16px; font-family:inherit; background:#fbfcfa; color:var(--ink); margin-bottom:10px;
  }
  input[type=text]:focus, input[type=date]:focus, input[type=password]:focus, select:focus{ outline:none; border-color:var(--accent); }
  input.cell-input{
    width:100%; padding:7px 8px; border-radius:7px; border:1.5px solid var(--line);
    font-size:13px; font-family:inherit; background:#fbfcfa; color:var(--ink); margin:0;
  }
  label.field-label{ font-size:13px; font-weight:700; color:var(--ink-soft); display:block; margin:0 0 6px; }
  .field-row{ display:flex; gap:8px; align-items:center; margin-bottom:8px; }
  .field-row input[type=text]{ margin-bottom:0; }
  .field-remove{
    flex-shrink:0; width:34px; height:34px; border-radius:8px; border:1.5px solid var(--line);
    background:#fff; color:var(--absent); font-size:16px; font-weight:700; cursor:pointer; font-family:inherit;
  }
  button.add-field{
    width:100%; padding:10px; border-radius:10px; border:1.5px dashed var(--line);
    background:transparent; color:var(--accent); font-size:13px; font-weight:700; cursor:pointer;
    font-family:inherit; margin-bottom:10px;
  }
  button.primary{ width:100%; margin-top:6px; padding:13px 14px; border:none; border-radius:10px; background:var(--accent); color:#fff; font-size:15px; font-weight:700; font-family:inherit; cursor:pointer; }
  button.primary:active{ opacity:.85; }
  button.secondary{ width:100%; margin-top:8px; padding:12px 14px; border-radius:10px; border:1.5px solid var(--line); background:transparent; color:var(--ink); font-size:14px; font-weight:600; font-family:inherit; cursor:pointer; }
  .status-pill{ display:inline-flex; align-items:center; gap:6px; font-size:12px; font-weight:700; padding:5px 10px; border-radius:999px; }
  .status-open{ background:var(--warn-soft); color:var(--warn); }
  .status-closed{ background:#EBEDE6; color:var(--ink-soft); }
  .status-dot{ width:7px; height:7px; border-radius:50%; background:currentColor; }
  .event-row{ padding:12px 0; border-top:1px solid var(--line); }
  .event-row:first-of-type{ border-top:none; }
  .event-row .row-top{ display:flex; justify-content:space-between; align-items:center; gap:8px; }
  .event-row .name{ font-weight:800; font-size:14px; }
  .event-row .meta{ color:var(--ink-soft); font-size:12px; margin-top:2px; }
  .stat-line{ display:flex; gap:14px; font-size:12px; color:var(--ink-soft); margin-top:6px; flex-wrap:wrap; }
  .stat-line b{ color:var(--ink); }
  table.list-table{ width:100%; border-collapse:collapse; font-size:13px; margin-top:10px; }
  table.list-table th{ text-align:left; font-size:11px; text-transform:uppercase; letter-spacing:.05em; color:var(--ink-soft); padding:6px 6px; border-bottom:1.5px solid var(--line); }
  table.list-table td{ padding:8px 6px; border-bottom:1px solid var(--line); vertical-align:middle; }
  table.list-table td.name{ font-weight:700; }
  .rate-bar-wrap{ display:flex; align-items:center; gap:8px; }
  .rate-bar-track{ flex:1; height:6px; border-radius:99px; background:#EBEDE6; overflow:hidden; }
  .rate-bar-fill{ height:100%; border-radius:99px; background:var(--accent); }
  .rate-num{ font-weight:800; font-variant-numeric:tabular-nums; min-width:40px; text-align:right; font-size:12px; }
  .big-rate{ display:flex; align-items:baseline; gap:6px; margin:6px 0 2px; }
  .big-rate .num{ font-size:40px; font-weight:800; letter-spacing:-0.02em; }
  .big-rate .unit{ font-size:16px; font-weight:700; color:var(--ink-soft); }
  .empty{ text-align:center; padding:24px 8px; color:var(--ink-soft); font-size:13px; }
  .toast{ position:fixed; left:50%; bottom:24px; transform:translateX(-50%); background:var(--ink); color:#fff; padding:11px 18px; border-radius:999px; font-size:13px; font-weight:600; box-shadow:0 8px 24px rgba(0,0,0,.18); opacity:0; pointer-events:none; transition:opacity .2s ease, transform .2s ease; z-index:50; white-space:nowrap; }
  .toast.show{ opacity:1; transform:translateX(-50%) translateY(-4px); }
  .note-shared{ font-size:11px; color:var(--ink-soft); background:#F5F6F1; border-radius:8px; padding:8px 10px; line-height:1.5; margin-top:10px; }
  .divider{ height:1px; background:var(--line); margin:12px 0; }
  .backlink{ font-size:13px; font-weight:700; color:var(--accent); cursor:pointer; display:inline-block; margin-bottom:10px; }
  .lock-icon{ font-size:32px; margin-bottom:6px; }
  .tag{ display:inline-block; background:var(--accent-soft); color:var(--accent); font-size:11px; font-weight:700; padding:3px 8px; border-radius:999px; margin:2px 4px 2px 0; }

/* 幹部模式：紅色 */
.officer-mode-pill{
  background:#dc2626 !important;
  color:#fff !important;
  border-color:#dc2626 !important;
}
.officer-mode-pill .status-dot{
  background:#fff !important;

#new-officer-pass{

#new-officer-user:focus,
#new-officer-pass:focus{
  outline:none;
  border-color:#111827;
  box-shadow:0 0 0 2px rgba(17,24,39,.08);
}


.admin-edit-box .officer-input{
  display:block;
  width:100%;
  box-sizing:border-box;
  height:46px;
  min-height:46px;
  padding:12px 14px;
  margin:8px 0;
  border:1px solid #d1d5db;
  border-radius:10px;
  font:inherit;
  background:#fff;
}


/* 幹部管理：每位幹部的三個操作按鈕並排 */
.officer-actions{
  display:grid !important;
  grid-template-columns:repeat(3, minmax(0, 1fr));
  gap:8px;
  width:100%;
  margin-top:8px;
}
.officer-actions button{
  width:100% !important;
  min-width:0;
  margin:0 !important;
  white-space:nowrap;
  padding-left:8px !important;
  padding-right:8px !important;
}


/* 建立活動：限制人數／自動關閉 */
.activity-options{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:10px;
  margin:10px 0;
}
.activity-option{
  width:100%;
  box-sizing:border-box;
}
.timer-options{
  display:grid;
  grid-template-columns:repeat(4,minmax(0,1fr));
  gap:8px;
  margin:8px 0 12px;
}
.timer-btn{
  margin:0 !important;
  width:100% !important;
  padding:10px 6px !important;
}
.timer-btn.selected{
  background:var(--accent) !important;
  color:#fff !important;
  border-color:var(--accent) !important;
}
.activity-created-by{
  font-size:12px;
  color:var(--ink-soft);
  margin-top:3px;
}
.activity-limit{
  font-size:12px;
  color:var(--ink-soft);
}
@media(max-width:520px){
  .activity-options{grid-template-columns:1fr;}
  .timer-options{grid-template-columns:repeat(4,1fr);}
}


/* 管理者：各功能獨立頁面 */
.admin-page{display:none;}
.admin-page.active{display:block;}
.admin-menu{display:grid;grid-template-columns:1fr 1fr;gap:10px;}
.admin-menu button{margin:0 !important;text-align:left;padding:14px !important;}
.admin-menu .menu-title{font-weight:800;display:block;}
.admin-menu .menu-hint{font-size:12px;color:var(--ink-soft);display:block;margin-top:3px;}
.activity-actions{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:7px;margin-top:10px;}
.activity-actions button{margin:0 !important;width:100% !important;padding:9px 5px !important;font-size:12px !important;white-space:nowrap;}
.activity-row-hidden{opacity:.55;}
.activity-hidden-tag{display:inline-block;background:#eee;color:#777;font-size:11px;padding:3px 7px;border-radius:999px;margin-left:5px;}
.admin-page-title{display:flex;align-items:center;gap:8px;margin-bottom:12px;}
.admin-page-title .back{width:auto;margin:0 !important;padding:7px 10px !important;}
@media(max-width:520px){
  .admin-menu{grid-template-columns:1fr;}
  .activity-actions{grid-template-columns:repeat(3,1fr);}
}

<body>
<div id="app"></div>
<div class="toast" id="toast"></div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
const SUPABASE_URL = "https://bnulmfijoovttegvllvc.supabase.co";
const SUPABASE_PUBLISHABLE_KEY = "sb_publishable_eSOD7XuCOMdRX11QH_f97A_76GU3wA0";
const supabaseClient = window.supabase.createClient(SUPABASE_URL, SUPABASE_PUBLISHABLE_KEY);
const ADMIN_SESSION_KEY = "haotian_admin_session";

async function adminLogin(username, password){
  const {data,error}=await supabaseClient.rpc("simple_admin_login",{
    p_username:username,
    p_access_code:password
  });
  if(error) throw error;
  if(!data?.ok) throw new Error(data?.message||"帳號或管理碼錯誤");

  localStorage.setItem(ADMIN_SESSION_KEY,JSON.stringify({
    username:data.username,
    role:data.role,
    access_code:password,
    at:Date.now()
  }));

  adminUnlocked=true;
  return data;
}

function getAdminSession(){
  try{
    const s=JSON.parse(localStorage.getItem(ADMIN_SESSION_KEY)||"null");
    if(!s?.username || !s?.access_code) return null;
    if(Date.now()-s.at>12*60*60*1000){
      localStorage.removeItem(ADMIN_SESSION_KEY);
      return null;
    }
    return s;
  }catch(e){return null;}
}

function adminRole(){
  const s=getAdminSession();
  return s?s.role:null;
}

function isSuperAdmin(){
  return adminRole()==="super_admin";
}

async function adminLogout(){
  localStorage.removeItem(ADMIN_SESSION_KEY);
  adminUnlocked=false;
}

async function checkAdminSession(){
  const s=getAdminSession();
  if(!s){
    adminUnlocked=false;
    return false;
  }

  // 重新向資料庫驗證目前管理碼，避免只依賴 localStorage。
  try{
    const r=await adminLogin(s.username,s.access_code);
    adminUnlocked=!!r?.ok;
    return adminUnlocked;
  }catch(e){
    localStorage.removeItem(ADMIN_SESSION_KEY);
    adminUnlocked=false;
    return false;
  }
}


const STORAGE_KEY = "event-registration-data";
let state = { activities: [], registrations: {}, adminPin: null };
let activeTab = "register";
let queryResultVisible = false;
let loaded = false;
let openEventId = null;      // which event card is expanded in register view
let adminExpandedId = null;  // which event's registrant list is expanded in admin tab
let adminUnlocked = false;   // in-memory only, resets on reload
let userIsTyping = false;    // true while an input/textarea/password field has focus
let pendingDeleteIdx = null; // index of registrant pending an in-page delete confirmation
let draftFields = ["公用哨角"]; // labels for the "建立新活動" form, reset after creating
let draftName = "";
let draftDate = "";
let draftMaxParticipants = "";
let draftCloseMinutes = 0;
let pendingPublishActivity = null;
let publishMode = "now";


let adminPage = "home";

document.addEventListener("focusin", (e)=>{
  const tag = e.target.tagName;
  if(tag === "INPUT" || tag === "TEXTAREA"){ userIsTyping = true; }
});
document.addEventListener("focusout", (e)=>{
  const tag = e.target.tagName;
  if(tag === "INPUT" || tag === "TEXTAREA"){ userIsTyping = false; }
});

function uid(){
  if(window.crypto && typeof window.crypto.randomUUID === "function"){
    return window.crypto.randomUUID();
  }
  // UUID v4 fallback for older browsers
  return "xxxxxxxx-xxxx-4xxx-yxxx-xxxxxxxxxxxx".replace(/[xy]/g, function(c){
    const r = Math.random()*16|0, v = c === "x" ? r : (r&3|8);
    return v.toString(16);
  });
}
function norm(s){ return (s||"").trim().replace(/\s+/g," "); }
function keyOf(name){ return norm(name).toLowerCase(); }
function escapeHtml(s){
  return String(s).replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
}
function fmtDate(iso){
  try{ return new Date(iso).toLocaleDateString('zh-TW',{year:'numeric',month:'numeric',day:'numeric'}); }
  catch(e){ return iso; }
}

function showToast(msg){
  const t = document.getElementById("toast");
  t.textContent = msg;
  t.classList.add("show");
  clearTimeout(t._timer);
  t._timer = setTimeout(()=> t.classList.remove("show"), 1800);
}

async function loadData(){
  try{
    let acts = [];

    if(adminUnlocked){
      const session=getAdminSession();
      const {data: adminData,error:adminErr}=await supabaseClient.rpc("simple_admin_list_activities",{
        p_admin_username:session.username,
        p_admin_code:session.access_code
      });
      if(adminErr) throw adminErr;
      if(!adminData?.ok) throw new Error(adminData?.message||"管理者活動資料讀取失敗");
      acts=adminData.activities||[];
    }else{
      const {data: publicActs,error:aErr}=await supabaseClient
        .from("activities")
        .select("*")
        .eq("hidden",false)
        .order("date",{ascending:false});
      if(aErr) throw aErr;
      acts=(publicActs||[]).filter(a=>!a.publish_at || new Date(a.publish_at).getTime()<=Date.now());
    }

    state.activities=(acts||[]).map(a=>({
      id:a.id,
      name:a.name,
      date:a.date,
      fields:Array.isArray(a.fields)?a.fields:[],
      open:!!a.open,
      maxParticipants:a.max_participants==null?null:Number(a.max_participants),
      createdBy:a.created_by||"",
      closeAt:a.close_at||null,
      autoCloseMinutes:a.auto_close_minutes==null?0:Number(a.auto_close_minutes),
      hidden:!!a.hidden,
      publishAt:a.publish_at||null
    }));

    state.registrations={};

    if(adminUnlocked){
      const session=getAdminSession();
      const {data: regData,error:rErr}=await supabaseClient.rpc("simple_admin_list_registrations",{
        p_admin_username:session.username,
        p_admin_code:session.access_code
      });
      if(rErr) throw rErr;
      if(!regData?.ok) throw new Error(regData?.message||"簽到資料讀取失敗");
      (regData.registrations||[]).forEach(r=>{
        if(!state.registrations[r.activity_id]) state.registrations[r.activity_id]=[];
        state.registrations[r.activity_id].push({
          id:r.id,
          activity_id:r.activity_id,
          name:r.name,
          fieldValues:r.field_values||{},
          ts:r.created_at
        });
      });
    }

    state.adminPin=null;
  }catch(e){
    console.error("Supabase load error:",e);
    showToast("雲端資料載入失敗："+(e?.message||""),"error");
  }
  loaded=true;
}
async function saveData(){
  // 保留舊函式名稱，實際資料由各操作直接寫入 Supabase。
  return true;
}

async function createActivityRemote(activity){
  const session=getAdminSession();
  if(!session) throw new Error("管理者登入已失效");

  const {data,error}=await supabaseClient.rpc("simple_admin_create_activity",{
    p_admin_username:session.username,
    p_admin_code:session.access_code,
    p_id:activity.id,
    p_name:activity.name,
    p_date:activity.date,
    p_fields:activity.fields,
    p_open:activity.open,
    p_max_participants:activity.maxParticipants,
    p_created_by:activity.createdBy||session.username,
    p_close_at:activity.closeAt,
    p_auto_close_minutes:activity.autoCloseMinutes||0,
    p_hidden:!!activity.hidden,
    p_publish_at:activity.publishAt||null
  });
  if(error) throw error;
  if(!data?.ok) throw new Error(data?.message||"建立活動失敗");
  return data.activity;
}
async function updateActivityRemote(activity){
  const session=getAdminSession();
  if(!session) throw new Error("管理者登入已失效");

  const {data,error}=await supabaseClient.rpc("simple_admin_update_activity",{
    p_admin_username:session.username,
    p_admin_code:session.access_code,
    p_id:activity.id,
    p_name:activity.name,
    p_date:activity.date,
    p_fields:activity.fields,
    p_open:activity.open,
    p_max_participants:activity.maxParticipants,
    p_created_by:activity.createdBy||session.username,
    p_close_at:activity.closeAt,
    p_auto_close_minutes:activity.autoCloseMinutes||0,
    p_hidden:!!activity.hidden,
    p_publish_at:activity.publishAt||null
  });
  if(error) throw error;
  if(!data?.ok) throw new Error(data?.message||"活動更新失敗");
  return data.activity;
}

async function deleteActivityRemote(activityId){
  const session=getAdminSession();
  if(!session) throw new Error("管理者登入已失效");

  const {data,error}=await supabaseClient.rpc("simple_admin_delete_activity",{
    p_admin_username:session.username,
    p_admin_code:session.access_code,
    p_id:activityId
  });
  if(error) throw error;
  if(!data?.ok) throw new Error(data?.message||"刪除活動失敗");
  return data;
}
async function createRegistrationRemote(activityId, registration){
  // 隊員簽到改走公開 RPC。
  // 不直接 INSERT registrations，避免被 Supabase RLS 擋住。
  const { data, error } = await supabaseClient.rpc("public_create_registration", {
    p_activity_id: activityId,
    p_name: registration.name,
    p_field_values: registration.fieldValues || {}
  });

  if(error) throw error;

  if(!data?.ok){
    throw new Error(data?.message || "簽到失敗");
  }

  return data.registration;
}

async function deleteRegistrationRemote(registrationId){
  const { error } = await supabaseClient.from("registrations").delete().eq("id", registrationId);
  if(error) throw error;
}

async function renameRegistrationRemote(registrationId, name){
  const { error } = await supabaseClient.from("registrations")
    .update({ name }).eq("id", registrationId);
  if(error) throw error;
}

async function testSupabaseConnection(){
  try{
    const { error } = await supabaseClient
      .from("activities")
      .select("id")
      .limit(1);
    if(error) throw error;
    return { ok:true };
  }catch(e){
    console.error("Supabase connection test:", e);
    return {
      ok:false,
      message:e?.message || "未知錯誤",
      code:e?.code || "",
      details:e?.details || "",
      hint:e?.hint || ""
    };
  }
}

function regsOf(activityId){ return state.registrations[activityId] || (state.registrations[activityId] = []); }

function filledCount(activity){
  const list = regsOf(activity.id);
  // count registrants who filled in at least one field with a non-empty value
  return list.filter(r => (activity.fields||[]).some(f => norm((r.fieldValues||{})[f.key]) !== "")).length;
}

function allKnownNames(){
  const set = new Set();
  Object.values(state.registrations).forEach(list=>{
    (list||[]).forEach(r => set.add(norm(r.name)));
  });
  return Array.from(set).sort((a,b)=> a.localeCompare(b,'zh-Hant'));
}

function activitiesThisYear(){
  const y = new Date().getFullYear();
  return state.activities.filter(a => new Date(a.date).getFullYear() === y);
}

function recentOrOpenActivities(){
  const sevenDaysAgo = Date.now() - 7*24*60*60*1000;
  return state.activities.filter(a=>{
    if(a.hidden) return false;
    const ts = a.publishAt ? new Date(a.publishAt).getTime() : null;
    if(Number.isFinite(ts) && ts > Date.now()) return false;
    return a.open || new Date(a.date).getTime() >= sevenDaysAgo;
  });
}

function annualStats(name){
  const k = keyOf(name);
  const acts = activitiesThisYear();
  let attended = 0;
  const detail = acts.map(a=>{
    const present = regsOf(a.id).some(r => keyOf(r.name) === k);
    if(present) attended++;
    return { activity: a, present };
  });
  const total = acts.length;
  const rate = total === 0 ? 0 : Math.round((attended/total)*1000)/10;
  return { attended, total, rate, detail };
}

function exportAnnualCSV(rows, year){
  const escapeCsv = (v)=>{
    const s=String(v);
    return /[",\n]/.test(s) ? '"' + s.replace(/"/g,'""') + '"' : s;
  };
  let csv="\uFEFF"+["姓名","參加場次","總場次","出席率(%)"].join(",")+"\n";
  rows.forEach(r=>{
    csv += [escapeCsv(r.name),r.attended,r.total,r.rate].join(",")+"\n";
  });
  const blob=new Blob([csv],{type:"text/csv;charset=utf-8;"});
  const url=URL.createObjectURL(blob);
  const a=document.createElement("a");
  a.href=url;
  a.download=`年度出席率總表_${year}.csv`;
  document.body.appendChild(a);
  a.click();
  document.body.removeChild(a);
  URL.revokeObjectURL(url);
}

function getPublishAt(){
  if(publishMode === "1day") return new Date(Date.now()+24*60*60*1000).toISOString();
  if(publishMode === "1week") return new Date(Date.now()+7*24*60*60*1000).toISOString();
  return null;
}

function formatCountdown(ms){
  const s=Math.max(0,Math.floor(ms/1000)),d=Math.floor(s/86400),h=Math.floor(s%86400/3600),m=Math.floor(s%3600/60),sec=s%60;
  return (d?d+"天 ":"")+String(h).padStart(2,"0")+":"+String(m).padStart(2,"0")+":"+String(sec).padStart(2,"0");
}
function renderCountdown(activity){
  const box=document.getElementById("event-countdown");if(!box)return;
  const timer=()=>{
    const now=Date.now(), end=activity.closeAt?new Date(activity.closeAt).getTime():null;
    if(end&&end>now) box.innerHTML=`<div class="countdown-box">⏳ 簽到截止倒數：${formatCountdown(end-now)}</div>`;
    else box.innerHTML="";
  };
  timer(); clearInterval(activity._countdownTimer); activity._countdownTimer=setInterval(timer,1000);
}

function renderRegister(el){
  const acts = [...recentOrOpenActivities()].sort((a,b)=> new Date(b.date) - new Date(a.date));

  if(openEventId){
    const activity = acts.find(a=>a.id===openEventId);
    if(!activity){ openEventId = null; return renderRegister(el); }
    const list = regsOf(activity.id);
    const fields = activity.fields || [];

    el.innerHTML = `
      <span class="backlink" id="back-link">← 回活動列表</span>
      <div class="card">
        <h2>${escapeHtml(activity.name)}</h2>
        <p class="hint">${fmtDate(activity.date)}</p>
        <span class="status-pill ${activity.open ? 'status-open':'status-closed'}"><span class="status-dot"></span>${activity.open ? '開放簽到中' : '已停止簽到'}</span>
        <div class="stat-line">
          <span><b>${list.length}</b>${activity.maxParticipants ? ` / ${activity.maxParticipants}` : ''} 人已簽到</span>
        </div><div id="event-countdown"></div>
        <div class="divider"></div>
        ${ activity.open ? `
          ${activity.maxParticipants && list.length >= activity.maxParticipants ? `
            <div class="hint" style="margin:10px 0;">此活動已達人數上限，暫停接受簽到。</div>
          ` : `
            <input type="text" id="reg-name" placeholder="輸入姓名" />
            ${ fields.map(f=>`
              <label class="field-label">${escapeHtml(f.label)}</label>
              <input type="text" class="reg-field-input" data-key="${f.key}" placeholder="請輸入${escapeHtml(f.label)}" />
            `).join("") }
            <button class="primary" id="reg-btn">完成簽到</button>
          `}
        ` : `<p class="hint">這個活動目前已停止簽到。</p>` }
      </div>
      <div class="card">
        <h2>簽到者名單（${list.length} 人）</h2>
        ${ list.length === 0 ? `<div class="empty">還沒有人簽到</div>` : `
          <table class="list-table">
            <thead><tr><th>姓名</th>${fields.map(f=>`<th>${escapeHtml(f.label)}</th>`).join("")}${activity.open ? '<th></th>' : ''}</tr></thead>
            <tbody>
              ${list.map((r,i)=>`
                <tr>
                  <td class="name">${escapeHtml(r.name)}</td>
                  ${fields.map(f=>`<td>${ (r.fieldValues && r.fieldValues[f.key]) ? escapeHtml(r.fieldValues[f.key]) : '—'}</td>`).join("")}
                  ${activity.open ? `<td><button class="field-remove" data-delete-reg="${i}" title="刪除這筆簽到">×</button></td>` : ''}
                </tr>
              `).join("")}
            </tbody>
          </table>
          ${ activity.open ? `<div class="note-shared">如果姓名打錯或欄位填錯，可以按 × 刪除自己的簽到紀錄，再重新填一次。</div>` : "" }
        `}
      </div>
    `;
    document.getElementById("back-link").addEventListener("click", ()=>{ openEventId = null; renderRegister(el); });

    if(activity.open){
      el.querySelectorAll("[data-delete-reg]").forEach(btn=>{
        btn.addEventListener("click", async ()=>{
          const idx = Number(btn.dataset.deleteReg);
          const reg = list[idx];
          if(reg && reg.id){
            try{
              await deleteRegistrationRemote(reg.id);
              list.splice(idx, 1);
              showToast("已刪除");
            }catch(e){ console.error(e); showToast("刪除失敗"); }
          }else{
            list.splice(idx, 1);
            showToast("已刪除");
          }
          renderRegister(el);
        });
      });
    }

    renderCountdown(activity);

    if(activity.open){
      const btn = document.getElementById("reg-btn");
      const nameInput = document.getElementById("reg-name");
      const doRegister = async ()=>{
        const name = norm(nameInput.value);
        if(!name){ showToast("請輸入姓名"); return; }
        if(list.some(r => keyOf(r.name) === keyOf(name))){ showToast(`${name} 已經簽到過了`); return; }
        const fieldValues = {};
        el.querySelectorAll(".reg-field-input").forEach(inp=>{
          fieldValues[inp.dataset.key] = norm(inp.value);
        });
        btn.disabled = true;
        try{
          const remote = await createRegistrationRemote(activity.id, { name, fieldValues });
          list.push({
            id: remote.id,
            name: remote.name,
            fieldValues: remote.field_values || {},
            ts: remote.created_at
          });
          showToast(`${name} 簽到成功！`);
          renderRegister(el);
        }catch(e){
          console.error(e);
          btn.disabled = false;
          showToast("簽到失敗，請再試一次");
        }
      };
      btn.addEventListener("click", doRegister);
    }
    return;
  }

  el.innerHTML = `
    <div class="card">
      <h2>選擇活動</h2>
      <p class="hint">點選活動以查看詳情並完成簽到。這裡只顯示最近一週內或尚未結束的活動，更早的歷史活動請洽管理者查詢。</p>
      ${ acts.length === 0 ? `<div class="empty">目前還沒有任何活動，請等待管理者建立</div>` :
        acts.map(a=>{
          return `
            <div class="event-row" data-open="${a.id}" style="cursor:pointer;">
              <div class="row-top">
                <div>
                  <div class="name">${escapeHtml(a.name)}</div>
                  <div class="meta">${fmtDate(a.date)}</div>
                  
                </div>
                <span class="status-pill ${a.open ? 'status-open':'status-closed'}"><span class="status-dot"></span>${a.open?'開放中':'已停止'}</span>
              </div>
              <div class="stat-line"><span><b>${(state.registrations[a.id]||[]).length}</b>${a.maxParticipants ? ` / ${a.maxParticipants}` : ""} 人已簽到</span></div>
            </div>
          `;
        }).join("")
      }
    </div>
  `;
  el.querySelectorAll("[data-open]").forEach(row=>{
    row.addEventListener("click", ()=>{ openEventId = row.dataset.open; renderRegister(el); });
  });
}

function renderQuery(el){
  el.innerHTML = `
    <div class="card">
      <h2>查詢我的年度出席率</h2>
      <p class="hint">輸入姓名，查看今年至今的活動簽到與出席狀況。</p>
      <input type="text" id="query-name" placeholder="輸入姓名" />
      <button class="primary" id="query-btn">查詢</button>
    </div>
    <div id="query-result"></div>
  `;
  const input = document.getElementById("query-name");
  const box = document.getElementById("query-result");

  function clearResult(){
    queryResultVisible = false;
    box.innerHTML = "";
    input.value = "";
  }

  const doQuery = ()=>{
    const name = norm(input.value);
    if(!name){ showToast("請輸入姓名"); return; }
    const acts = activitiesThisYear();
    if(acts.length === 0){
      box.innerHTML = `<div class="card"><div class="empty">今年還沒有任何活動</div></div>`;
      return;
    }
    const s = annualStats(name);
    queryResultVisible = true;
    box.innerHTML = `
      <span class="backlink" id="query-back-link">← 返回重新查詢</span>
      <div class="card">
        <h2>${escapeHtml(name)} · ${new Date().getFullYear()} 年</h2>
        <div class="big-rate"><span class="num">${s.rate}</span><span class="unit">% 出席率</span></div>
        <p class="hint" style="margin-top:2px;">簽到並出現於 ${s.attended} / 共 ${s.total} 場今年舉辦的活動</p>
        <table class="list-table">
          <thead><tr><th>活動</th><th>日期</th><th>狀態</th></tr></thead>
          <tbody>
            ${ s.detail.slice().reverse().map(d=>`
              <tr>
                <td class="name">${escapeHtml(d.activity.name)}</td>
                <td>${fmtDate(d.activity.date)}</td>
                <td>${d.present ? '✓ 已簽到' : '—'}</td>
              </tr>
            `).join("") }
          </tbody>
        </table>
      </div>
    `;
    document.getElementById("query-back-link").addEventListener("click", clearResult);
  };
  document.getElementById("query-btn").addEventListener("click", doQuery);
  input.addEventListener("keydown",(e)=>{ if(e.key==="Enter") doQuery(); });
}

刪除後無法使用此帳號登入。`)) return;

            p_admin_username:session.username,
            p_admin_code:session.access_code,
            p_username:username
          });

          if(result.error) throw result.error;
          if(!result.data?.ok) throw new Error(result.data?.message||"刪除失敗");

          showToast("幹部已刪除");
          await renderAdminAccounts(el);
        }catch(e){
          target.disabled=false;
          showAdminMessage("刪除失敗：" + (e?.message||"未知錯誤"));
        }
      }
    };

    el.__officerClickHandler=handler;
    el.addEventListener("click", handler);

  }catch(e){
    el.innerHTML=`
      <div class="card">
        <h2>👥 幹部管理</h2>
        <p class="hint">讀取失敗：${escapeHtml(e?.message||"未知錯誤")}</p>
        <button type="button" class="secondary" id="back-admin-error">返回管理後台</button>
      </div>
    `;
    document.getElementById("back-admin-error").onclick=()=>{
      window.__adminAccountsViewOpen=false;
      renderAdmin(el);
    };
  }
}

        </div>

            <span class="menu-title">📋 活動管理</span>

            <span class="menu-hint">新增、停用、刪除、修改密碼</span>
          </button>`:""}
        </div>
      </div>`;
  }

  if(adminPage==="create"){
    content=`
      <div class="card">
        <div class="admin-page-title">
          <button class="secondary back" data-admin-page="home">←</button>
          <h2 style="margin:0;">建立活動</h2>
        </div>

        <input type="date" id="new-date" value="${escapeHtml(draftDate)}" />
        <div class="activity-options">

          </div>
          <div class="activity-option">
            <label class="field-label">活動關閉計時器</label>
            <div class="timer-options">
              <button type="button" class="secondary timer-btn ${draftCloseMinutes===0?'selected':''}" data-timer="0">無</button>
              <button type="button" class="secondary timer-btn ${draftCloseMinutes===5?'selected':''}" data-timer="5">5分</button>
              <button type="button" class="secondary timer-btn ${draftCloseMinutes===10?'selected':''}" data-timer="10">10分</button>
              <button type="button" class="secondary timer-btn ${draftCloseMinutes===20?'selected':''}" data-timer="20">20分</button>
            </div>
          </div>
        </div>
        <label class="field-label">簽到欄位</label>
        <div id="draft-fields-wrap">
          ${draftFields.map((label,i)=>`
            <div class="field-row">
              <input type="text" class="draft-field-input" data-idx="${i}" value="${escapeHtml(label)}" placeholder="欄位名稱，例如：報名費" />

        <button type="button" class="secondary timer-btn publish-choice" data-publish-mode="1day">一天後</button>

<button type="button" class="primary" id="create-btn">建立</button>

    content=`

        <div class="admin-page-title">

                <td><div class="rate-bar-wrap"><div class="rate-bar-track"><div class="rate-bar-fill" style="width:${r.rate}%;"></div></div><span class="rate-num">${r.rate}%</span></div></td>
              </tr>`).join("")}</tbody>
          </table>`}
      </div>`;

  el.innerHTML=`
    <div class="card" style="display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap;">
      <span class="status-pill ${isSuperAdmin()?"status-open":"officer-mode-pill"}"><span class="status-dot"></span>${isSuperAdmin()?"管理者模式":"幹部模式"}</span>

function activityAdminRow(a, hidden=false){
  const list=regsOf(a.id);
  return `
    <div class="event-row ${hidden?'activity-row-hidden':''}">
      <div class="row-top">
        <div>
          <div class="name">${escapeHtml(a.name)} ${hidden?'<span class="activity-hidden-tag">已隱藏</span>':''}</div>
          <div class="meta">${fmtDate(a.date)} · 建立者：${escapeHtml(a.createdBy||"—")}</div><div class="activity-created-by">${a.publishAt && Number.isFinite(new Date(a.publishAt).getTime()) && new Date(a.publishAt).getTime()>Date.now() ? `發布時間：${new Date(a.publishAt).toLocaleString("zh-TW",{hour12:false})}` : `發布時間：立即`}</div>
        </div>
        <span class="status-pill ${a.publishAt && Number.isFinite(new Date(a.publishAt).getTime()) && new Date(a.publishAt).getTime()>Date.now() ? 'status-closed' : (a.open?'status-open':'status-closed')}"><span class="status-dot"></span>${a.publishAt && Number.isFinite(new Date(a.publishAt).getTime()) && new Date(a.publishAt).getTime()>Date.now() ? '未發布' : (a.open?'開放中':'已停止')}</span>
      </div>
      <div class="stat-line">
        <span><b>${list.length}</b>${a.maxParticipants?` / ${a.maxParticipants}`:""} 人簽到</span>
        <span>${a.maxParticipants?`上限 ${a.maxParticipants} 人`:"無人數限制"}</span>
      </div>
      <div class="activity-actions">
        <button class="secondary" data-activity-close="${a.id}">${a.open?"關閉":"開啟"}</button>
        <button class="secondary" data-activity-hide="${a.id}">${hidden?"取消隱藏":"隱藏"}</button>
        <button class="secondary" data-activity-delete="${a.id}">刪除</button>
      </div>
    </div>`;
}

function rememberCreateDraft(){
  const n=document.getElementById("new-name");
  const d=document.getElementById("new-date");
  const m=document.getElementById("new-max-participants");
  if(n) draftName=n.value;
  if(d) draftDate=d.value;
  if(m) draftMaxParticipants=m.value;
  document.querySelectorAll(".draft-field-input").forEach(inp=>{
    const i=Number(inp.dataset.idx);
    if(Number.isFinite(i)) draftFields[i]=inp.value;
  });
}
function setupCreateActivityPage(el){
  function syncDraftFieldsFromDom(){
    draftName=document.getElementById("new-name")?.value||"";
    draftDate=document.getElementById("new-date")?.value||"";
    const max=document.getElementById("new-max-participants");
    draftMaxParticipants=max?max.value:"";
    document.querySelectorAll(".draft-field-input").forEach(inp=>draftFields[Number(inp.dataset.idx)]=inp.value);
  }

  ["new-name","new-date","new-max-participants"].forEach(id=>{
    const input=document.getElementById(id);
    if(input){
      input.addEventListener("input",rememberCreateDraft);
      input.addEventListener("change",rememberCreateDraft);
    }
  });
  el.querySelectorAll(".draft-field-input").forEach(input=>{
    input.addEventListener("input",rememberCreateDraft);
    input.addEventListener("change",rememberCreateDraft);
  });

  document.getElementById("add-field-btn").onclick=()=>{
    syncDraftFieldsFromDom(); draftFields.push(""); renderAdmin(el);
  };
  el.querySelectorAll("[data-remove-field]").forEach(btn=>{
    btn.onclick=()=>{syncDraftFieldsFromDom();draftFields.splice(Number(btn.dataset.removeField),1);renderAdmin(el);};
  });
  el.querySelectorAll("[data-timer]").forEach(btn=>{
    btn.onclick=(ev)=>{
      ev.preventDefault();
      ev.stopPropagation();
      draftCloseMinutes=Number(btn.dataset.timer || 0);
      el.querySelectorAll("[data-timer]").forEach(b=>{
        b.classList.toggle("selected", Number(b.dataset.timer||0)===draftCloseMinutes);
      });
    };
  });
  el.querySelectorAll(".publish-choice").forEach(btn=>{
    btn.onclick=(ev)=>{
      ev.preventDefault();
      ev.stopPropagation();
      publishMode=btn.dataset.publishMode || "now";
      el.querySelectorAll(".publish-choice").forEach(b=>b.classList.toggle("selected",b===btn));
      rememberCreateDraft();
    };
  });

  document.getElementById("create-btn").onclick=async()=>{
    const createBtn=document.getElementById("create-btn"), errBox=document.getElementById("create-activity-error");
    syncDraftFieldsFromDom();
    const name=norm(draftName), maxRaw=(document.getElementById("new-max-participants")?.value||"").trim();
    const maxParticipants=maxRaw===""?null:Number(maxRaw), closeMinutes=Number(draftCloseMinutes||0);
    const publishAt =
      publishMode==="1day" ? new Date(Date.now()+24*60*60*1000).toISOString() :
      publishMode==="1week" ? new Date(Date.now()+7*24*60*60*1000).toISOString() :
      null;
    if(!name){showToast("請輸入活動名稱");return;}
    if(maxParticipants!==null&&(!Number.isInteger(maxParticipants)||maxParticipants<1)){showToast("人數限制請輸入 1 以上整數");return;}
    const date=draftDate?new Date(draftDate).toISOString():new Date().toISOString();
    const fields=draftFields.map(l=>norm(l)).filter(Boolean).map(label=>({key:uid(),label}));
    const session=getAdminSession();
    const activity={id:uid(),name,date,fields,open:true,maxParticipants,createdBy:session?.username||"",closeAt:closeMinutes?new Date(Date.now()+closeMinutes*60000).toISOString():null,autoCloseMinutes:closeMinutes,hidden:false,publishAt:publishAt};
    createBtn.disabled=true;
    try{
      const saved=await createActivityRemote(activity);
      state.activities.push({
        ...activity,
        ...saved,
        id:saved.id||activity.id,
        publishAt:saved.publish_at||null
      });
      state.registrations[activity.id]=[];
      pendingPublishActivity=null;
      showToast(publishAt ? "活動已建立，尚未發布" : "活動已建立並發布");
      adminPage="activities";
      renderAdmin(el);
    }catch(e){
      const msg=[e?.message,e?.code,e?.details,e?.hint].filter(Boolean).join(" | ");
      if(errBox){errBox.textContent="建立活動失敗："+(msg||"未知錯誤");errBox.classList.add("show");}
      showToast("建立活動失敗","error");createBtn.disabled=false;
    }
  };
}


function showPublishChooser(el){
  pendingPublishActivity=null;
  adminPage="activities";
  renderAdmin(el);
}

function setupActivityManagementPage(el){
  el.querySelectorAll("[data-activity-close]").forEach(btn=>{
    btn.onclick=async()=>{
      const a=state.activities.find(x=>x.id===btn.dataset.activityClose);
      if(!a)return;
      const next=!a.open;
      if(!confirm(next?`確定重新開放「${a.name}」？`:`確定關閉「${a.name}」？`))return;
      a.open=next;
      try{await updateActivityRemote(a);showToast(next?"已重新開放":"已關閉");renderAdmin(el);}
      catch(e){a.open=!next;showToast("活動更新失敗："+(e?.message||"未知錯誤"),"error");}
    };
  });

  el.querySelectorAll("[data-activity-hide]").forEach(btn=>{
    btn.onclick=async()=>{
      const a=state.activities.find(x=>x.id===btn.dataset.activityHide);
      if(!a)return;
      const next=!a.hidden;
      if(!confirm(next?`確定隱藏「${a.name}」？
隊員活動列表將不再顯示。`:`確定取消隱藏「${a.name}」？`))return;
      a.hidden=next;
      try{await updateActivityRemote(a);showToast(next?"活動已隱藏":"已取消隱藏");renderAdmin(el);}
      catch(e){a.hidden=!next;showToast("隱藏狀態更新失敗："+(e?.message||"未知錯誤"),"error");}
    };
  });

  el.querySelectorAll("[data-activity-delete]").forEach(btn=>{
    btn.onclick=async()=>{
      const a=state.activities.find(x=>x.id===btn.dataset.activityDelete);
      if(!a)return;
      if(!confirm(`確定永久刪除「${a.name}」？
此活動的簽到資料也會刪除，無法復原。`))return;
      btn.disabled=true;
      try{
        await deleteActivityRemote(a.id);
        state.activities=state.activities.filter(x=>x.id!==a.id);
        delete state.registrations[a.id];
        showToast("活動已刪除");renderAdmin(el);
      }catch(e){
        btn.disabled=false;
        showToast("刪除失敗："+(e?.message||"請確認 Supabase 權限"),"error");
      }
    };
  });
}
function renderAdminLock(el){
  el.innerHTML=`<div class="card" style="text-align:center;">
    <div class="lock-icon">🔒</div><h2>管理者登入</h2>
    <p class="hint">請輸入管理者帳號與密碼。</p>
    <input type="text" id="admin-username" placeholder="帳號" autocomplete="username">
    <input type="password" id="admin-password" placeholder="密碼" autocomplete="current-password">
    <button class="primary" id="admin-login-btn">登入管理者</button>
  </div>`;
  const b=document.getElementById("admin-login-btn"),u=document.getElementById("admin-username"),p=document.getElementById("admin-password");
  const login=async()=>{
    if(!norm(u.value)){showToast("請輸入帳號");return;}
    if(!p.value){showToast("請輸入密碼");return;}
    b.disabled=true;
    try{await adminLogin(norm(u.value),p.value);showToast("登入成功");renderAdmin(el);}
    catch(e){showToast("登入失敗："+(e?.message||"帳號或密碼錯誤"));b.disabled=false;}
  };
  if(b) b.onclick=login;
  [u,p].forEach(x=>x.addEventListener("keydown",e=>{if(e.key==="Enter")login();}));
}

async function init(){
  render();
  await checkAdminSession();
  await loadData();
  render();
  setInterval(async ()=>{
    if(userIsTyping || activeTab === 'query') return;

    // 自動關閉計時器：到時間後將活動設為停止簽到
    const now = Date.now();
    const expired = state.activities.filter(a => a.open && a.closeAt && new Date(a.closeAt).getTime() <= now);

    for(const a of expired){
      try{
        a.open = false;
        await updateActivityRemote(a);
      }catch(e){
        console.error("活動自動關閉失敗", e);
        a.open = true;
      }
    }

    if(activeTab !== "admin"){
      await loadData();
      renderTab();
    }else if(!userIsTyping){
      // 管理者頁面不重繪，避免建立活動中的輸入資料被清空。
      await loadData();
    }
  },6000);
}

init();

window.addEventListener("error",function(ev){
  console.error("前端錯誤：",ev.error||ev.message);
  const app=document.getElementById("app");
  if(app && !app.innerHTML.trim()){
    app.innerHTML='<div class="card"><h2>頁面載入錯誤</h2><p class="hint">請重新整理頁面；若仍空白，請開啟瀏覽器主控台查看錯誤。</p><pre style="white-space:pre-wrap;">'+escapeHtml(ev.message||"JavaScript error")+'</pre></div>';
  }
});
</script>

window.addEventListener("error",function(e){var b=document.getElementById("runtime-debug"),x=document.getElementById("runtime-debug-text");if(b&&x){b.style.display="block";x.textContent="JavaScript 錯誤："+String(e.message||"未知錯誤")+(e.filename?"\n檔案："+e.filename:"")+(e.lineno?"\n行："+e.lineno:"");}});
window.addEventListener("unhandledrejection",function(e){var b=document.getElementById("runtime-debug"),x=document.getElementById("runtime-debug-text");if(b&&x){b.style.display="block";x.textContent="Promise 錯誤："+String(e.reason&&e.reason.message||e.reason||"未知錯誤");}});
