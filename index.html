/* ===== v16 CSS normalization ===== */
:root{
  --bg:#f5f5f3;
  --surface:#fff;
  --surface-2:#f0f0ed;
  --ink:#171717;
  --muted:#777;
  --line:#e7e7e3;
  --accent:#c9141b;
  --accent-soft:#fff0f0;
  --success:#22a35a;
  --warning:#e59a13;
  --danger:#b42318;
  --admin-super:#f59e0b;
  --radius:22px;
  --small-radius:14px;
  --btn-h:48px;
}

/* Header: admin access replaces the bell position. */
.top-admin-access{
  width:42px;height:42px;border-radius:14px;
  background:#fff;border:1px solid var(--line);
  color:var(--ink);display:grid;place-items:center;
  flex:0 0 auto;cursor:pointer;
}
.top-admin-access svg{width:21px;height:21px;color:var(--ink)}
.top-admin-access.super{color:var(--admin-super);border-color:#f2d39a}
.top-admin-access.super svg{color:var(--admin-super)}
.top-admin-access.officer{color:var(--accent);border-color:#efb8bb}
.top-admin-access.officer svg{color:var(--accent)}
.top-admin-access.guest{color:var(--ink)}
.top-admin-access.guest svg{color:var(--ink)}

/* One input rule for the whole system. */
input[type=text],
input[type=date],
input[type=password],
input[type=number],
select,
textarea,
.officer-input{
  width:100%;
  min-height:48px;
  padding:0 14px;
  background:#f7f7f5;
  border:1px solid var(--line);
  border-radius:14px;
  color:var(--ink);
  outline:none;
  font:inherit;
  box-sizing:border-box;
}
textarea{padding:12px 14px;line-height:1.5;resize:vertical}
input:focus,
select:focus,
textarea:focus{
  border-color:var(--accent);
  box-shadow:0 0 0 3px rgba(201,20,27,.10);
}
input::placeholder,
textarea::placeholder{color:#aaa}
input[type=number]{appearance:textfield}

/* All action buttons share the same red pressed/selected state. */
button.primary,
.choice.selected{
  background:var(--accent);
  border-color:var(--accent);
  color:#fff;
}
button.secondary:active,
.icon-btn:active,
.add-field:active,
.admin-actions button:active,
.officer-actions button:active,
.query-search-button:active,
.back:active{
  background:var(--accent);
  border-color:var(--accent);
  color:#fff;
}
button.primary:active,
.choice.selected:active{
  background:#a90f15;
  border-color:#a90f15;
}
button.secondary:focus-visible,
.icon-btn:focus-visible,
.add-field:focus-visible,
.admin-actions button:focus-visible,
.officer-actions button:focus-visible,
.query-search-button:focus-visible,
.back:focus-visible{
  outline:2px solid rgba(201,20,27,.25);
  outline-offset:2px;
}

/* Icons: black by default; announcement and permission icons are explicit exceptions. */
.top-brand-icon,
.metric-icon,
.admin-action .menu-icon,
.activity-icon,
.admin-card-icon,
.officer-icon,
.form-title .ico,
.icon-btn,
.query-search-icon{
  color:var(--ink);
}
.announcement-icon,
.announcement-edit,
.announcement-edit svg{
  color:var(--accent);
}
.announcement-icon{background:var(--accent-soft)}
.query-search-icon{
  background:#f2f2ef;
}
.query-search-button{
  width:42px;height:42px;
  border:0;border-radius:12px;
  background:transparent;
  color:var(--accent);
  display:grid;place-items:center;
  cursor:pointer;flex:0 0 auto;
}
.query-search-button svg{width:20px;height:20px;color:var(--accent);stroke-width:2.5}

/* Query row keeps the input itself on the unified input rule. */
.query-search-row{
  display:flex;align-items:center;gap:10px;
  background:#fff;border:1px solid var(--line);
  border-radius:18px;padding:10px 12px;margin-bottom:14px;

}
.query-search-label{

}
