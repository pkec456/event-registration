<html lang="zh-Hant">

<title>台中浩天宮四紅哨角隊 活動簽到簿｜V2.5</title>
<style>/*
 * ============================================================
 * CSS 架構索引｜活動簽到系統 V2.5
 * 原則：先分類、再驗證；不新增功能，不以重寫方式整理既有 CSS。
 *
 * 維護規則：
 * 1. 保留原有宣告順序，避免意外改變 cascade / specificity。
 * 2. 重複選擇器可能是 RWD 或後續覆蓋，不可只看名稱就刪除。
 * 3. 新增樣式先找既有元件規則，避免在檔案尾端不斷疊加覆蓋。
 * 4. 每次只整理可證明冗餘的規則；視覺變更需另做回歸測試。
 *
 * 分區標記（以各註解標記為準，不依行號）：
 * A. 設計變數、全域基礎與共用元件（本區起始）
 * B. 隊員端活動列表、活動卡片與狀態元件
 * C. 隊員查詢、搜尋表單與出席資料
 * D. 管理首頁、管理活動卡片與管理操作
 * E. 管理者角色標頭與登入介面
 * F. 活動狀態、簽到名單與倒數顯示
 * G. 管理首頁統計、類別卡片與圖表
 * H. 手機版管理首頁 RWD 微調
 * I. 共用圖示尺寸與搜尋按鈕視覺
 * J. V2.5 品牌配色與語意狀態色
 * K. 待開放活動灰化與年度出席率名單呈現
 *
 * 注意：分區註解是導覽，不代表已將規則搬移、合併或完成視覺驗收。
 * ============================================================
 */
/* CSS 區塊 A：設計變數、全域基礎與共用元件 */
:root{
  /* 共用尺寸與管理角色變數 */
  --radius:22px;
  --btn-h:48px;
  --admin-super:#f59e0b;

  /* V2.5 品牌變數（最終值） */
  --bg:#f7f2eb;
  --surface:#ffffff;
  --surface-2:#f4eee5;
  --ink:#292421;
  --muted:#786d65;
  --line:#e8ddd0;
  --accent:#a92f32;
  --accent-soft:#f8e8e3;
  --primary:#a92f32;
  --success:#26784f;
  --danger:#a92f32;
}
*{box-sizing:border-box}
html{background:var(--bg)}
body{margin:0;background:var(--bg);color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang TC","Microsoft JhengHei",sans-serif;-webkit-font-smoothing:antialiased}
button,input,select{font:inherit}
button{cursor:pointer;border:0;color:inherit}
button:disabled{opacity:.5;cursor:not-allowed}
#app{max-width:520px;margin:0 auto;padding:0 16px 92px}
.top{padding:22px 2px 14px;display:flex;align-items:center;justify-content:space-between;gap:12px}
.top-brand{display:flex;align-items:center;gap:11px;min-width:0}
.top-brand-icon{width:42px;height:42px;border-radius:14px;background:#171717;color:#fff;place-items:center;flex:0 0 auto}
.top-brand h1{margin:0;font-size:18px;line-height:1.2;font-weight:850}
.top-brand p{margin:4px 0 0;color:var(--muted);font-size:12px}
.tabs{position:sticky;top:0;z-index:10;display:grid;grid-template-columns:repeat(2,1fr);gap:8px;padding:7px;background:rgba(245,245,243,.94);backdrop-filter:blur(12px);margin:0 -16px 16px;padding-left:16px;padding-right:16px;border-bottom:1px solid var(--line)}
.tabs button{min-height:42px;background:transparent;border-radius:13px;font-size:13px;font-weight:800;color:#777;display:flex;align-items:center;justify-content:center;gap:6px}
.tabs button.active{background:var(--accent);color:#fff}
.section-head{display:flex;align-items:end;justify-content:space-between;gap:10px;margin:18px 2px 10px}
.section-head h2{margin:0;font-size:16px;font-weight:850}
.section-head span{font-size:12px;color:var(--muted)}
.block{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);padding:18px;margin-bottom:12px}
.block.tight{padding:14px}
.block.soft{background:var(--surface-2);border-color:transparent}
.announcement{background:#fff;border:1px solid var(--line);border-radius:var(--radius);padding:16px;display:flex;gap:12px;align-items:flex-start}
.announcement-icon{width:42px;height:42px;border-radius:14px;color:var(--accent);display:grid;place-items:center;flex:0 0 auto}
.announcement h3{margin:0 0 4px;font-size:14px}
.announcement p{margin:0;color:#666;font-size:13px;line-height:1.5}
.announcement-edit{margin-left:auto}
.announcement-edit:hover{background:#ffe1e1}
.announcement-admin{margin-top:12px}
.announcement-admin textarea{width:100%;min-height:92px;resize:vertical;padding:12px 14px;background:#f7f7f5;border:1px solid #e2e2de;border-radius:14px;outline:none;font:inherit;font-size:14px;line-height:1.5}
.announcement-admin textarea:focus{border-color:#999;box-shadow:0 0 0 3px #eee}
/* CSS 區塊 B：隊員端活動列表、活動卡片與狀態元件 */
.activity-grid{display:grid;gap:12px}
.activity-card{background:#fff;border:1px solid var(--line);border-radius:var(--radius);padding:16px;cursor:pointer;transition:transform .12s ease,box-shadow .12s ease}
.activity-card:active{transform:scale(.99)}
.activity-top{display:flex;gap:12px;align-items:flex-start}
.activity-icon{width:46px;height:46px;border-radius:16px;background:#f1f1ef;display:grid;place-items:center;flex:0 0 auto}
.activity-main{min-width:0;flex:1}
.activity-name{font-size:17px;font-weight:850}
.event-category-label{display:inline-flex;align-items:center;width:max-content;max-width:100%;margin-bottom:4px;padding:3px 9px;border-radius:999px;background:#fff0f0;color:#c9141b;font-size:17px;font-weight:850;line-height:1.4}
.admin-card-title-block .event-category-label{font-size:16px;margin-bottom:3px}
.activity-meta{margin-top:4px;color:#777;font-size:12px}

.count{font-size:13px;font-weight:800;white-space:nowrap}
.arrow{color:#999}
.status{display:inline-flex;align-items:center;gap:6px;font-size:11px;font-weight:800;padding:6px 9px;border-radius:999px}
.status svg{width:14px!important;height:14px!important;min-width:14px!important;flex:0 0 14px!important;stroke-width:2.5}
.status.open{background:#eaf8ef;color:var(--success)}
.status.closed{background:#efefec;color:#777}
.status.future{background:#fff5dd;color:#b56e00}
.status.manual{background:#fff5dd;color:#b56e00}
.dot{width:7px;height:7px;border-radius:50%;background:currentColor}
.back{display:inline-flex;align-items:center;gap:7px;color:#666;font-size:13px;font-weight:800;background:transparent;padding:4px 0;margin:2px 0 14px}
.back:hover{color:#171717}
.page-title{font-size:25px;font-weight:900;letter-spacing:-.03em;margin:0}
.page-subtitle{margin:5px 0 18px;color:#777;font-size:13px}
.form-block{background:#fff;border:1px solid var(--line);border-radius:var(--radius);padding:18px;margin-bottom:12px}
.form-title{display:flex;align-items:center;gap:9px;font-size:14px;font-weight:850;margin-bottom:14px}
.form-title .ico{width:34px;height:34px;border-radius:11px;background:#f2f2ef;display:grid;place-items:center}
.field{margin-bottom:14px}
.field:last-child{margin-bottom:0}
.field-label{display:block;font-size:12px;font-weight:850;color:#555;margin-bottom:7px}
.field-hint{font-size:11px;color:#999;margin-top:5px}
input[type=text],input[type=date],input[type=time],input[type=password],input[type=number],select{width:100%;height:48px;padding:0 14px;background:#f7f7f5;border:1px solid #e2e2de;border-radius:14px;color:#171717;outline:none}
input:focus,select:focus{border-color:#999;box-shadow:0 0 0 3px #eee}
input[type=number]{appearance:textfield}
input[type=date],input[type=time]{width:100%;max-width:100%;min-width:0;min-height:48px;box-sizing:border-box;padding:0 12px;appearance:none;-webkit-appearance:none}
@media(max-width:430px) {
input[type=date],input[type=time]{width:100%;max-width:100%;min-width:0;min-inline-size:0;font-size:14px;box-sizing:border-box;display:block}
}

.grid-2>.field{min-width:0}
#new-publish-date,#new-publish-time{width:100% !important;max-width:100% !important;min-width:0 !important;min-inline-size:0 !important;box-sizing:border-box !important;display:block !important;padding-left:12px !important;padding-right:12px !important}
@media(max-width:430px) {
.grid-2{grid-template-columns:minmax(0,1fr) !important}
.grid-2>.field{width:100% !important;min-width:0 !important}
#new-publish-time{width:100% !important;max-width:100% !important;min-width:0 !important;min-inline-size:0 !important;box-sizing:border-box !important;font-size:14px !important}
}
.grid-2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.choice-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.choice-grid.four{grid-template-columns:repeat(4,1fr)}
.choice{min-height:44px;border:1px solid var(--line);background:#f7f7f5;border-radius:13px;font-size:12px;font-weight:800}
.choice.selected{background:var(--accent);color:#fff;border-color:var(--accent)}
.draft-field{display:flex;gap:8px;margin-bottom:8px}
.draft-field input{flex:1}
.icon-btn{width:44px;height:48px;border-radius:14px;background:#f7f7f5;border:1px solid var(--line);display:grid;place-items:center;flex:0 0 auto}
.icon-btn.danger{color:var(--danger)}
.add-field{width:100%;height:44px;border:1px dashed #ccc;background:transparent;border-radius:13px;color:#555;font-weight:800;font-size:13px;display:flex;align-items:center;justify-content:center;gap:7px}
.primary{width:100%;min-height:var(--btn-h);background:var(--accent);color:#fff;border-radius:15px;font-weight:850;font-size:15px;display:flex;align-items:center;justify-content:center;gap:8px}
.secondary{min-height:44px;padding:0 14px;background:#fff;border:1px solid var(--line);border-radius:13px;font-weight:800;font-size:13px}
.secondary:hover{background:#f7f7f5}
.danger-btn{color:var(--danger)}
.checkin-card{background:#fff;border:1px solid var(--line);border-radius:var(--radius);padding:18px}
.checkin-button{margin-top:4px}
.list{margin-top:8px}
.list-row{display:flex;align-items:center;gap:10px;padding:14px 0;border-bottom:1px solid var(--line)}
.list-row:last-child{border-bottom:0}
.list-index{width:28px;height:28px;border-radius:10px;background:#f1f1ef;display:grid;place-items:center;font-size:11px;font-weight:850}
.list-main{flex:1;min-width:0}
.list-name{font-weight:800;font-size:14px}
.list-meta{font-size:11px;color:#999;margin-top:2px}
.check{color:var(--success)}
.history-status{width:30px;height:30px;border-radius:50%;display:grid;place-items:center;flex:0 0 auto}
.history-status svg{width:18px;height:18px;stroke-width:3}
.history-status.present{color:#22a35a;background:#eaf8ee}

/* CSS 區塊 C：隊員查詢、搜尋表單與出席資料 */

.query-search-label{display:flex;align-items:center;gap:8px;flex:0 0 auto;white-space:nowrap;color:var(--ink)}
.query-search-label strong{font-size:14px}
.query-search-icon{color:var(--primary)}

@media(max-width:430px) {
.query-search-row{gap:8px;padding:9px}
.query-search-label{gap:6px}
.query-search-label strong{font-size:13px}
.query-search-icon{width:34px;height:34px}
}

.monthly-chart-card{background:#fff;border:1px solid var(--line);border-radius:20px;padding:14px 12px 12px;margin:0 0 14px}

.monthly-chart-wrap{width:100%;overflow:hidden}
.monthly-chart-svg{display:block;width:100%;height:auto;overflow:visible}
.monthly-chart-gridline{stroke:#ece8e5;stroke-width:1}
.monthly-chart-axis{stroke:#cfcac5;stroke-width:1}
.monthly-chart-y-label{fill:#888;font-size:9px}
.monthly-chart-x-label{fill:#777;font-size:9px}
.monthly-chart-line{fill:none;stroke:var(--accent);stroke-width:2.5;stroke-linecap:round;stroke-linejoin:round}
.monthly-chart-point{fill:#fff;stroke:var(--accent);stroke-width:2;cursor:pointer;pointer-events:all}
.monthly-chart-point:focus{stroke-width:3;outline:none}
.monthly-chart-footnote{padding:0 4px;color:#999;font-size:10px}
.monthly-chart-detail{margin-top:12px;padding-top:12px;border-top:1px solid var(--line)}
.monthly-chart-detail[hidden]{display:none}
.monthly-chart-detail-title{font-size:14px;font-weight:900;margin-bottom:8px}
.monthly-chart-activity{padding:10px 0;border-bottom:1px solid var(--line)}
.monthly-chart-activity:last-child{border-bottom:0}
.monthly-chart-activity-name{font-size:13px;font-weight:800;overflow-wrap:anywhere}
.monthly-chart-activity-meta{font-size:11px;color:var(--muted);margin-top:3px}
/* CSS 區塊 D：管理首頁、管理活動卡片與管理操作 */
.admin-summary{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.metric{background:#fff;border:1px solid var(--line);border-radius:18px;padding:14px 8px;text-align:center}
.metric-icon{width:34px;height:34px;margin:0 auto 7px;border-radius:11px;background:#f2f2ef;display:grid;place-items:center}
.metric b{display:block;font-size:22px}
.metric span{font-size:10px;color:#777}
.admin-menu{display:grid;gap:10px}
.admin-action{min-height:76px;background:#fff;border:1px solid var(--line);border-radius:20px;padding:14px 16px;display:flex;align-items:center;gap:12px;text-align:left}
.admin-action .menu-icon{width:42px;height:42px;border-radius:14px;background:#f2f2ef;display:grid;place-items:center;flex:0 0 auto}
.admin-action .menu-text{flex:1}
.admin-action strong{display:block;font-size:14px}
.admin-action small{display:block;margin-top:4px;color:#888;font-size:11px}
.admin-action .chev{color:#999}
.admin-head{display:flex;align-items:center;justify-content:space-between;gap:10px}
.admin-head .actions{display:flex;gap:7px}
.activity-admin-card{background:#fff;border:1px solid var(--line);border-radius:20px;padding:15px;margin-bottom:10px}
.category-activity-admin-card{cursor:pointer;transition:transform .12s ease,box-shadow .12s ease}
.category-activity-admin-card:active{transform:scale(.99)}
.category-activity-admin-card .admin-card-status{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.activity-admin-card.hidden{opacity:.65}
.admin-card-top{display:flex;gap:10px;align-items:flex-start}
.admin-card-info{flex:1;min-width:0}
.admin-card-name{font-weight:900;font-size:15px}
.admin-card-meta{font-size:11px;color:#888;margin-top:3px}
.admin-card-status{margin-top:8px}
.admin-actions{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;margin-top:13px;padding-top:12px;border-top:1px solid var(--line)}
.admin-actions button{min-height:42px;padding:5px 4px;background:#f7f7f5;border:1px solid var(--line);border-radius:12px;font-size:10px;font-weight:800;display:flex;flex-direction:column;gap:4px;align-items:center;justify-content:center}
.admin-actions button.danger{color:var(--danger)}

.officer-top{display:flex;align-items:center;gap:11px}

.officer-info{flex:1}

.admin-edit-box{margin-top:10px}
.rate-list{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px}
.rate-card{position:relative;background:#fff;border:1px solid var(--line);border-radius:14px;padding:10px 10px 11px;text-align:left;min-width:0;overflow:hidden}
.rate-head{display:flex;align-items:center;gap:6px;min-height:30px;font-size:20px;font-weight:850;line-height:1.2;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.rate-head-name{font-size:18px;font-weight:400;overflow:hidden;text-overflow:ellipsis}
.rate-rank-icon{width:18px;height:18px;flex:0 0 18px;stroke-width:2.5}
.rate-rank-icon.champion{color:#d97706}
.rate-rank-icon.up{color:#16a34a}
.rate-rank-icon.down{color:#dc2626}
.rate-bar{height:6px;background:#e5e7eb;border-radius:999px;overflow:hidden;margin:7px 0 6px}
.rate-bar-fill{transition:width .2s ease}
.rate-percent{font-size:20px;font-weight:950;line-height:1.1}
.rate-detail {
font-size:9px;color:#64748b;font-weight:750;white-space:nowrap;
}
@media(max-width:600px) {
.rate-list{grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}
.rate-card{border-radius:12px;padding:8px 8px 9px}
.rate-head{font-size:20px;gap:5px;min-height:29px}
.rate-rank-icon{width:18px;height:18px;flex-basis:18px}
.rate-bar{height:5px;margin:6px 0 5px}
.rate-percent{font-size:20px}
.rate-detail {
font-size:8px;
}
}
.empty{text-align:center;color:#888;padding:28px 10px;font-size:13px}
.debug-error-box{display:none;margin-top:10px;padding:12px;border-radius:14px;background:#fff0f0;border:1px solid #f0b6b6;color:#a00;font-size:12px;white-space:pre-wrap;word-break:break-word}
.debug-error-box.show{display:block}
.note-shared{font-size:11px;color:#888;background:#f5f5f3;border-radius:13px;padding:10px 12px;line-height:1.5;margin-top:10px}
.divider{height:1px;background:var(--line);margin:14px 0}
.toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:#171717;color:#fff;padding:11px 17px;border-radius:999px;font-size:12px;font-weight:700;opacity:0;pointer-events:none;transition:.2s;z-index:50;max-width:90vw}
.toast.show{opacity:1;transform:translateX(-50%) translateY(-4px)}
.manual-return-overlay{position:fixed;inset:0;background:rgba(0,0,0,.42);display:flex;align-items:center;justify-content:center;padding:20px;z-index:1000;backdrop-filter:blur(3px)}
.manual-return-modal{width:min(360px,100%);background:#fff;border-radius:22px;padding:22px;box-shadow:0 18px 50px rgba(0,0,0,.2)}
.manual-return-modal h3{margin:0;font-size:17px;font-weight:900;text-align:center}
.manual-return-modal p{margin:8px 0 18px;color:#777;font-size:13px;text-align:center}
.manual-return-actions{display:grid;grid-template-columns:1fr 1fr;gap:9px}
.manual-return-actions button{min-height:46px;border-radius:14px;font-weight:850;font-size:13px}
.manual-return-save{background:var(--accent);color:#fff;border:1px solid var(--accent)}
.manual-return-discard{background:#fff;color:#555;border:1px solid var(--line)}
.system-footer{margin-top:28px;padding:10px 0;text-align:center;color:#aaa;font-size:10px;line-height:1.6}
.system-footer .version{font-weight:800}
.system-footer .maker{margin-top:1px}
.table-wrap{overflow-x:auto}
.list-table{width:100%;border-collapse:collapse;font-size:12px}
.list-table th{text-align:left;color:#888;font-size:10px;padding:8px;border-bottom:1px solid var(--line)}
.list-table td{padding:10px 8px;border-bottom:1px solid var(--line);vertical-align:middle}
.list-table td.name{font-weight:800}
.rate-bar-fill{height:100%;background:var(--accent);border-radius:99px}
@media(max-width:420px) {
.grid-2{grid-template-columns:1fr}
.choice-grid.four{grid-template-columns:repeat(2,1fr)}
.admin-actions{grid-template-columns:repeat(2,1fr)}

}
.query-person{background:#fff;border:1px solid var(--line);border-radius:22px;padding:18px;display:flex;align-items:center;gap:12px;margin-bottom:10px}
.query-person-icon{width:46px;height:46px;border-radius:15px;background:var(--accent-soft);color:var(--accent);display:grid;place-items:center;flex:0 0 auto}
.result-name{font-size:21px;font-weight:900;line-height:1.2}
.result-year{display:flex;align-items:center;gap:5px;font-size:12px;color:#888;margin-top:5px}
.query-metrics{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:16px}
.query-metric-card{background:#fff;border:1px solid var(--line);border-radius:22px;padding:15px 10px;text-align:center;min-width:0}
.metric-card-title{display:flex;align-items:center;justify-content:center;gap:6px;font-size:13px;font-weight:850;margin-bottom:10px}
.metric-card-title svg{width:17px;height:17px;color:var(--accent)}
.donut{width:132px;height:132px;border-radius:50%;margin:2px auto 10px;background:conic-gradient(var(--donut-color) var(--value),#ececea 0);display:grid;place-items:center;position:relative}
.donut::before{content:"";position:absolute;inset:10px;background:#fff;border-radius:50%}
.donut-center{position:relative;z-index:1;display:flex;flex-direction:column;align-items:center;justify-content:center}
.donut-center strong{font-size:31px;line-height:1;font-weight:950;color:var(--donut-color)}
.donut-center strong small{font-size:17px;margin-left:1px}
.donut-center span{font-size:10px;color:#888;margin-top:5px;font-weight:700}
.metric-badge{display:inline-flex;align-items:center;justify-content:center;min-height:30px;padding:0 12px;border-radius:999px;background:color-mix(in srgb,var(--badge-color) 13%,white);color:var(--badge-color);font-size:11px;font-weight:900}
.signins-badge{--badge-color:var(--success);background:#eaf8ef;color:var(--success)}
.query-metric-card.red{--badge-color:#d62828}
.query-metric-card.orange{--badge-color:#f59e0b}
.query-metric-card.green{--badge-color:#22a35a}
.query-metric-card.gold{--badge-color:#d99a00}
.query-metric-card.red .donut-center strong,.query-metric-card.orange .donut-center strong,.query-metric-card.green .donut-center strong,.query-metric-card.gold .donut-center strong{color:var(--badge-color)}
.query-history .list-row{padding:14px 4px}
.query-history .list-icon{width:36px;height:36px;border-radius:12px;background:#f3f3f0;color:var(--accent);display:grid;place-items:center;flex:0 0 auto}
.query-history .status{white-space:nowrap}
.query-history .status svg{width:15px;height:15px}
@media(max-width:420px) {
.query-metrics{gap:8px}
.query-metric-card{padding:14px 7px}
.donut{width:116px;height:116px}
.donut-center strong{font-size:28px}
.donut::before{inset:9px}
}

/* ===== 活動管理最終除錯層 ===== */
(function(){
  async function activityButtonHandler(ev){
    const btn=ev.target && ev.target.closest &&
      ev.target.closest("[data-activity-close],[data-activity-edit],[data-activity-hide],[data-activity-delete]");
    if(!btn) return;
    ev.preventDefault();
    ev.stopPropagation();

    const id=btn.getAttribute("data-activity-close") ||
             btn.getAttribute("data-activity-edit") ||
             btn.getAttribute("data-activity-hide") ||
             btn.getAttribute("data-activity-delete");

    let a=(window.state && Array.isArray(state.activities))
      ? state.activities.find(x=>String(x.id)===String(id))
      : null;

    // state 可能因頁面重繪尚未同步；直接以按鈕上的 UUID 查資料庫。
    if(!a){
      try{
        const {data:remoteActivity,error:remoteError}=await supabaseClient
          .from("activities")
          .select("*")
          .eq("id",id)
          .maybeSingle();

        if(remoteError) throw remoteError;

        if(remoteActivity){
          a={
            id:remoteActivity.id,
            name:remoteActivity.name,
            date:remoteActivity.date,
            fields:Array.isArray(remoteActivity.fields)?remoteActivity.fields:[],
            open:!!remoteActivity.open,
            maxParticipants:remoteActivity.max_participants==null?null:Number(remoteActivity.max_participants),
            createdBy:remoteActivity.created_by||"",
            closeAt:remoteActivity.close_at||null,
            autoCloseMinutes:remoteActivity.auto_close_minutes==null?0:Number(remoteActivity.auto_close_minutes),
            hidden:!!remoteActivity.hidden,
            publishAt:remoteActivity.publish_at||null
          };

          if(window.state){
            window.state.activities=Array.isArray(window.state.activities)?window.state.activities:[];
            const idx=window.state.activities.findIndex(x=>String(x.id)===String(id));
            if(idx>=0) window.state.activities[idx]=a;
            else window.state.activities.push(a);
          }
        }
      }catch(dbErr){
        console.error("[活動管理] 直接查詢活動失敗",dbErr);
        window.showToast("讀取活動失敗："+(dbErr.message||dbErr),"error");
        return;
      }
    }

    if(!a){
      window.showToast("資料庫找不到此活動："+id,"error");
      console.error("[活動管理] 資料庫也找不到活動",id);
      return;
    }

    if(btn.hasAttribute("data-activity-edit")){
      openManualRegistrationEditor(a);
    }else if(btn.hasAttribute("data-activity-close")){
      activityActionClose(a,btn);
    }else if(btn.hasAttribute("data-activity-hide")){
      activityActionHide(a,btn);
    }else{
      activityActionDelete(a,btn);
    }
  }

  async function activityActionClose(a,btn){
    const next=!a.open;
    if(next){
      const activityDay=window.activityDateKey?window.activityDateKey(a.date):"";
      const today=window.localDateKey?window.localDateKey():new Date().toISOString().slice(0,10);
      const scheduledAt=a.publishAt?new Date(a.publishAt).getTime():NaN;
      if(activityDay && activityDay>today){
        window.showToast("活動日期為 "+activityDay+"，請等待活動當天自動開放簽到。","error");
        return;
      }
      if(Number.isFinite(scheduledAt) && scheduledAt>Date.now()){
        window.showToast("此活動尚在等待開放，請等到排定時間。","error");
        return;
      }
    }
    if(!confirm(next?"確定開啟「"+a.name+"」？":"確定關閉「"+a.name+"」？")) return;

    btn.disabled=true;
    const oldOpen=a.open;
    const oldCloseAt=a.closeAt;
    const oldAuto=a.autoCloseMinutes;

    try{
      if(next){
        // 開啟與 30 秒截止時間同一次寫入，避免先開啟成功、期限寫入失敗而永不自動關閉。
        const deadline=Date.now()+30000;
        const sharedCloseAt=new Date(deadline).toISOString();
        a.open=true;
        a.closeAt=sharedCloseAt;
        a.autoCloseMinutes=0;
        await window.updateActivityRemote(a);

        a.closeAt=sharedCloseAt;
        a.autoCloseMinutes=0;
        window.v25ExpiryRetryAt.delete(String(a.id));
        window.v93CountdownDeadlines.set(String(a.id),deadline);

        // 更新本機 state，但不重新 loadData，避免輸入框／倒數被重建。
        if(window.state && Array.isArray(window.state.activities)){
          const local=window.state.activities.find(x=>String(x.id)===String(a.id));
          if(local){
            local.open=true;
            local.closeAt=sharedCloseAt;
            local.autoCloseMinutes=0;
          }
        }

        window.showToast("活動已開啟，30 秒後關閉簽到");
      }else{
        a.open=false;
        a.closeAt=null;
        a.autoCloseMinutes=0;
        await window.updateActivityRemote(a);

        window.v93CountdownDeadlines.delete(String(a.id));
        window.v25ExpiryRetryAt.delete(String(a.id));
        // 確保關閉狀態寫回目前 state；背景 loadData 可能已替換活動物件。
        const current=window.state?.activities?.find(item=>String(item.id)===String(a.id));
        if(current){
          current.open=false;
          current.closeAt=null;
          current.autoCloseMinutes=0;
        }
        window.showToast("活動已關閉");
      }

      if(typeof renderAdmin==="function"){
        const tab=document.getElementById("tab-content");
        if(tab) window.renderAdmin(tab);
      }
      btn.disabled=false;
      if(typeof window.refreshActivityListClocks==="function"){
        window.refreshActivityListClocks();
      }
      if(typeof refreshIcons==="function") refreshIcons();

    }catch(e){
      console.error("[活動管理] 開啟／關閉失敗",e);
      a.open=oldOpen;
      a.closeAt=oldCloseAt;
      a.autoCloseMinutes=oldAuto;
      window.v93CountdownDeadlines.delete(String(a.id));
      window.showToast("活動更新失敗："+(e.message||e),"error");
      btn.disabled=false;
    }
  }
  async function activityActionHide(a,btn){
    const next=!a.hidden;
    if(!confirm(next?"確定隱藏「"+a.name+"」？":"確定取消隱藏「"+a.name+"」？")) return;
    btn.disabled=true;
    const old=!!a.hidden;
    a.hidden=next;
    try{
      await window.updateActivityRemote(a);
      if(window.state && Array.isArray(window.state.activities)){
        const idx=window.state.activities.findIndex(x=>String(x.id)===String(a.id));
        if(idx>=0) window.state.activities[idx].hidden=next;
      }
      a.hidden=next;
      window.showToast(next?"活動已隱藏":"已取消隱藏");
      if(typeof renderAdmin==="function"){
        const tab=document.getElementById("tab-content");
        if(tab){
          window.renderAdmin(tab);
          if(next){
            setTimeout(function(){
              const section=document.getElementById("hidden-activities-section");
              if(section) section.scrollIntoView({behavior:"smooth",block:"start"});
            },50);
          }
        }
      }
      if(typeof refreshIcons==="function") refreshIcons();
    }catch(e){
      a.hidden=old;
      console.error("[活動管理] 隱藏失敗",e);
      window.showToast("隱藏更新失敗："+(e.message||e),"error");
      btn.disabled=false;
    }
  }

  async function activityActionDelete(a,btn){
    if(!confirm("確定永久刪除「"+a.name+"」？\n此活動的簽到資料也會刪除，無法復原。")) return;
    btn.disabled=true;
    try{
      await window.deleteActivityRemote(a.id);
      window.state.activities=window.state.activities.filter(x=>String(x.id)!==String(a.id));
      delete window.state.registrations[a.id];
      window.showToast("活動已刪除");
      await window.loadData();
      if(typeof renderAdmin==="function") window.renderAdmin(document.getElementById("tab-content"));
    }catch(e){
      console.error("[活動管理] 刪除失敗",e);
      window.showToast("刪除失敗："+(e.message||e),"error");
      btn.disabled=false;
    }
  }

  document.addEventListener("click",async(ev)=>{
    const btn=ev.target.closest("[data-admin-edit-registration]");
    if(!btn) return;
    ev.preventDefault();
    ev.stopPropagation();
    const activityId=btn.getAttribute("data-activity-id");
    const registrationId=btn.getAttribute("data-registration-id");
    const a=state.activities.find(x=>String(x.id)===String(activityId));
    if(!a || !a.open){
      showToast("活動已關閉，無法修改名單");
      return;
    }
    const r=(state.registrations[a.id]||[]).find(x=>String(x.id)===String(registrationId));
    if(!r) return;
    const name=prompt("修改姓名",r.name||"");
    if(name===null) return;
    const clean=norm(name);
    if(!clean){ showToast("姓名不可空白"); return; }
    try{
      await renameRegistrationRemote(registrationId,clean);
      await loadData();
      renderAdmin(document.getElementById("tab-content"));
      showToast("已修改簽到資料");
    }catch(e){
      console.error("修改簽到失敗",e);
      showToast("修改失敗："+(e?.message||e),"error");
    }
  },true);

  // capture=true：在任何其他 click handler 前攔截活動按鈕。
  document.addEventListener("click",activityButtonHandler,true);
})();
</script>

<script>
(function(){
  document.addEventListener("input",function(ev){
    const el=ev.target;
    if(!el || !el.classList || !el.classList.contains("register-name-input")) return;
    const old=el.value;
    const cleaned=old.replace(/[0-9０-９]/g,"");
    if(old!==cleaned){
      const p=el.selectionStart;
      el.value=cleaned;
      if(typeof p==="number"){
        try{el.setSelectionRange(Math.max(0,p-1),Math.max(0,p-1));}catch(e){}
      }
    }
  },true);
})();

</script>
