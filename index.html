:root{
  --bg:#f5f5f3;
  --surface:#fff;
  --surface-2:#f0f0ed;
  --ink:#171717;
  --muted:#777;
  --line:#e7e7e3;
  --accent:#c9141b;
  --accent-soft:#fff0f0;
  --success:#22a35a;
  --warning:#e59a13;
  --danger:#b42318;
  --admin-super:#f59e0b;
  --radius:22px;
  --small-radius:14px;
  --btn-h:48px;
}

/* Header: admin access replaces the bell position. */
.top-admin-access{
  width:42px;height:42px;border-radius:14px;
  background:#fff;border:1px solid var(--line);
  color:var(--ink);display:grid;place-items:center;
  flex:0 0 auto;cursor:pointer;
}
.top-admin-access svg{width:21px;height:21px;color:var(--ink)}
.top-admin-access.super{color:var(--admin-super);border-color:#f2d39a}
.top-admin-access.super svg{color:var(--admin-super)}
.top-admin-access.officer{color:var(--accent);border-color:#efb8bb}
.top-admin-access.officer svg{color:var(--accent)}
.top-admin-access.guest{color:var(--ink)}
.top-admin-access.guest svg{color:var(--ink)}

/* One input rule for the whole system. */
input[type=text],
input[type=date],
input[type=password],
input[type=number],
select,
textarea,
.officer-input{
  width:100%;
  min-height:48px;
  padding:0 14px;
  background:#f7f7f5;
  border:1px solid var(--line);
  border-radius:14px;
  color:var(--ink);
  outline:none;
  font:inherit;
  box-sizing:border-box;
}
textarea{padding:12px 14px;line-height:1.5;resize:vertical}
input:focus,
select:focus,
textarea:focus{
  border-color:var(--accent);
  box-shadow:0 0 0 3px rgba(201,20,27,.10);
}
input::placeholder,
textarea::placeholder{color:#aaa}
input[type=number]{appearance:textfield}

/* All action buttons share the same red pressed/selected state. */
button.primary,
.choice.selected{
  background:var(--accent);
  border-color:var(--accent);
  color:#fff;
}
button.secondary:active,
.icon-btn:active,
.add-field:active,
.admin-actions button:active,
.officer-actions button:active,
.query-search-button:active,
.back:active{
  background:var(--accent);
  border-color:var(--accent);
  color:#fff;
}
button.primary:active,
.choice.selected:active{
  background:#a90f15;
  border-color:#a90f15;
}
button.secondary:focus-visible,
.icon-btn:focus-visible,
.add-field:focus-visible,
.admin-actions button:focus-visible,
.officer-actions button:focus-visible,
.query-search-button:focus-visible,
.back:focus-visible{
  outline:2px solid rgba(201,20,27,.25);
  outline-offset:2px;
}

/* Icons: black by default; announcement and permission icons are explicit exceptions. */
.top-brand-icon,
.metric-icon,
.admin-action .menu-icon,
.activity-icon,
.admin-card-icon,
.officer-icon,
.form-title .ico,
.icon-btn,
.query-search-icon{
  color:var(--ink);
}
.announcement-icon,
.announcement-edit,
.announcement-edit svg{
  color:var(--accent);
}
.announcement-icon{background:var(--accent-soft)}
.query-search-icon{
  background:#f2f2ef;
}
.query-search-button{
  width:42px;height:42px;
  border:0;border-radius:12px;
  background:transparent;
  color:var(--accent);
  display:grid;place-items:center;
  cursor:pointer;flex:0 0 auto;
}
.query-search-button svg{width:20px;height:20px;color:var(--accent);stroke-width:2.5}

/* Query row keeps the input itself on the unified input rule. */
.query-search-row{
  display:flex;align-items:center;gap:10px;
  background:#fff;border:1px solid var(--line);
  border-radius:18px;padding:10px 12px;margin-bottom:14px;
  box-shadow:0 4px 14px rgba(0,0,0,.04);
}
.query-search-label{
  display:flex;align-items:center;gap:8px;
  flex:0 0 auto;white-space:nowrap;color:var(--ink);
}
.query-search-label strong{font-size:14px}
.query-search-icon{
  width:36px;height:36px;border-radius:12px;
  display:grid;place-items:center;
}
.query-search-icon svg{width:19px;height:19px}
.query-search-input{
  flex:1;min-width:0;
  background:transparent;border:0;padding:0;
}
.query-search-input input{
  height:48px;
  min-height:48px;
  background:#f7f7f5;
  border:1px solid var(--line);
  border-radius:14px;
  padding:0 14px;
}
.query-search-input input:focus{
  border-color:var(--accent);
  box-shadow:0 0 0 3px rgba(201,20,27,.10);
}

/* Permission header: orange = super admin, red = officer. */
.admin-role-header.super-admin{
  background:var(--admin-super);
}
.admin-role-header.officer-admin{
  background:var(--accent);
}
.admin-role-header .admin-role-icon,
.admin-role-header .admin-role-icon svg,
.admin-role-header .admin-role-badge,
.admin-role-header .admin-role-logout{
  color:#fff;
}
.officer-role,.role-officer{color:var(--accent)}

@media(max-width:430px){
  .query-search-row{gap:8px;padding:9px}
  .query-search-label{gap:6px}
  .query-search-label strong{font-size:13px}
  .query-search-icon{width:34px;height:34px}

}

.activity-card.activity-card-open .activity-meta{

.activity-list-head{
  display:flex;
  align-items:center;

}
.activity-list-open-status{
  display:inline-flex;

}
.activity-list-open-status .dot{
  width:7px;height:7px;border-radius:50%;
  background:#22a35a;
  display:inline-block;
}


.activity-right{display:flex;align-items:center;gap:9px;flex:0 0 auto}
.activity-status-clock{
  width:48px;height:48px;flex:0 0 48px;
  position:relative;display:grid;place-items:center;border-radius:50%;
}
.activity-status-clock svg{
  position:absolute;inset:0;width:48px;height:48px;
  transform:rotate(-90deg);
}
.activity-status-clock circle{fill:none;stroke-width:2.8}
.activity-status-clock .clock-track{stroke:#eadede}
.activity-status-clock .clock-progress{stroke:var(--accent);stroke-linecap:round}
.activity-status-clock span{
  position:relative;z-index:1;color:var(--accent);
  font-size:9px;font-weight:900;letter-spacing:-.03em;line-height:1;
}
.activity-status-clock.open{
  background:#edf8f0;color:#22a35a;
}
.activity-status-clock.open svg{position:static;transform:none;width:22px;height:22px}
.activity-status-clock.open svg circle{display:none}
.activity-status-clock.open i{width:22px;height:22px;color:#22a35a}
.activity-status-clock.closed{
  background:#f1f1ef;color:var(--ink);
}
.activity-status-clock.closed i{width:21px;height:21px;color:var(--ink)}
@media(max-width:430px){
  .activity-right{gap:6px}

async function createActivityRemote(activity){
  const session=getAdminSession();
  if(!session) throw new Error("管理者登入已失效");

  const {data,error}=await supabaseClient.rpc("simple_admin_create_activity",{
    p_admin_username:session.username,
    p_admin_code:session.access_code,
    p_id:activity.id,
    p_name:activity.name,
    p_date:activity.date,
    p_fields:activity.fields,
    p_open:activity.open,
    p_max_participants:activity.maxParticipants,
    p_created_by:activity.createdBy||session.username,
    p_close_at:activity.closeAt,
    p_auto_close_minutes:activity.autoCloseMinutes||0,
    p_hidden:!!activity.hidden,
    p_publish_at:activity.publishAt||null
  });
  if(error) throw error;
  if(!data?.ok) throw new Error(data?.message||"建立活動失敗");

  // 相容舊／新 SQL 回傳格式：
  // 舊版可能回傳 data.activity；部分 SQL 只回傳 data.id。
  // 前端不能直接讀 undefined.id，因此永遠整理成完整 activity。
  const raw=data.activity || data;
  return {
    ...activity,
    ...(raw && typeof raw === "object" ? raw : {}),
    id: raw?.id || activity.id,
    name: raw?.name ?? activity.name,
    date: raw?.date ?? activity.date,
    fields: Array.isArray(raw?.fields) ? raw.fields : activity.fields,
    open: typeof raw?.open === "boolean" ? raw.open : activity.open,
    maxParticipants: raw?.max_participants !== undefined
      ? (raw.max_participants == null ? null : Number(raw.max_participants))
      : (raw?.maxParticipants !== undefined ? raw.maxParticipants : activity.maxParticipants),
    createdBy: raw?.created_by ?? raw?.createdBy ?? activity.createdBy,
    closeAt: raw?.close_at ?? raw?.closeAt ?? activity.closeAt,
    autoCloseMinutes: raw?.auto_close_minutes !== undefined
      ? Number(raw.auto_close_minutes || 0)
      : Number(raw?.autoCloseMinutes ?? activity.autoCloseMinutes ?? 0),
    hidden: typeof raw?.hidden === "boolean" ? raw.hidden : activity.hidden,
    publishAt: raw?.publish_at ?? raw?.publishAt ?? activity.publishAt ?? null
  };
}

function normalizeActivityForRPC(activity){
  const x={...activity};

  // PostgreSQL date parameter: accept Date, ISO timestamp, YYYY/M/D and
  // YYYY-MM-DD, and always send a valid YYYY-MM-DD when possible.
  if(x.date instanceof Date && !isNaN(x.date.getTime())){
    x.date=x.date.toISOString().slice(0,10);
  }else if(typeof x.date==="string"){
    const s=x.date.trim();
    let m=s.match(/^(\d{4})[\/-](\d{1,2})[\/-](\d{1,2})/);
    if(m){
      x.date=`${m[1]}-${String(m[2]).padStart(2,"0")}-${String(m[3]).padStart(2,"0")}`;
    }else{
      const d=new Date(s);
      if(!isNaN(d.getTime())) x.date=d.toISOString().slice(0,10);
    }
  }

  x.fields=Array.isArray(x.fields)?x.fields:[];
  x.maxParticipants =
    x.maxParticipants==null || x.maxParticipants==="" ? null :
    Number(x.maxParticipants);
  if(x.maxParticipants!==null && !Number.isFinite(x.maxParticipants))
    x.maxParticipants=null;

  x.autoCloseMinutes=Number(x.autoCloseMinutes||0);
  if(!Number.isFinite(x.autoCloseMinutes)) x.autoCloseMinutes=0;

  x.closeAt=x.closeAt||null;
  x.publishAt=x.publishAt||null;
  x.open=!!x.open;
  x.hidden=!!x.hidden;
  return x;
}

async function updateActivityRemote(activity){
  const session=getAdminSession();
  if(!session) throw new Error("管理者登入已失效");

  const a=normalizeActivityForRPC(activity);
  const {data,error}=await supabaseClient.rpc("simple_admin_update_activity",{
    p_admin_username:String(session.username||""),
    p_admin_code:String(session.access_code||""),
    p_id:String(a.id||""),
    p_name:String(a.name||""),
    p_date:a.date,
    p_fields:Array.isArray(a.fields)?a.fields:[],
    p_open:!!a.open,
    p_max_participants:a.maxParticipants==null?null:Number(a.maxParticipants),
    p_created_by:String(a.createdBy||session.username||""),
    p_close_at:a.closeAt||null,
    p_auto_close_minutes:Number(a.autoCloseMinutes||0),
    p_hidden:!!a.hidden,
    p_publish_at:a.publishAt||null
  });

  if(error){
    const detail=[error.message,error.details,error.hint,error.code]
      .filter(Boolean).join(" | ");
    throw new Error(detail||"活動更新失敗");
  }
  if(!data?.ok) throw new Error(data?.message||"活動更新失敗");

  const raw=data.activity||null;
  return {
    ...a,
    ...(raw&&typeof raw==="object"?raw:{})
  };
}

async function deleteRegistrationRemote(registrationId){
  // 直接刪除後必須確認資料庫真的消失。
  const direct=await supabaseClient.from("registrations").delete().eq("id",registrationId);
  if(!direct.error){
    const verify=await supabaseClient.from("registrations")
      .select("id").eq("id",registrationId).maybeSingle();
    if(!verify.error && !verify.data) return true;
  }

  console.warn("直接刪除未確認成功，嘗試公開刪除 RPC：",direct.error);

  const rpc=await supabaseClient.rpc("public_delete_registration",{
    p_registration_id:registrationId
  });

  if(rpc.error) throw rpc.error;
  if(rpc.data && rpc.data.ok===false){
    throw new Error(rpc.data.message||"刪除簽到失敗");
  }

  const verify2=await supabaseClient.from("registrations")
    .select("id").eq("id",registrationId).maybeSingle();
  if(verify2.error) throw verify2.error;
  if(verify2.data) throw new Error("資料庫仍存在這筆簽到紀錄");

  return true;
}

const SIGNED_LOCAL_KEY="haotian_signed_names_v1";
function getLocalSignedMap(){
  try{return JSON.parse(localStorage.getItem(SIGNED_LOCAL_KEY)||"{}")||{};}
  catch(e){return {};}
}
function hasLocalSigned(activityId,name){
  const map=getLocalSignedMap();
  const arr=Array.isArray(map[activityId])?map[activityId]:[];
  return arr.some(n=>keyOf(n)===keyOf(name));
}
function rememberLocalSigned(activityId,name){
  const map=getLocalSignedMap();
  if(!Array.isArray(map[activityId])) map[activityId]=[];
  if(!map[activityId].some(n=>keyOf(n)===keyOf(name))) map[activityId].push(norm(name));
  localStorage.setItem(SIGNED_LOCAL_KEY,JSON.stringify(map));
}
function forgetLocalSigned(activityId,name){
  const map=getLocalSignedMap();
  if(Array.isArray(map[activityId])){
    map[activityId]=map[activityId].filter(n=>keyOf(n)!==keyOf(name));
    localStorage.setItem(SIGNED_LOCAL_KEY,JSON.stringify(map));
  }
}

function regsOf(activityId){ return state.registrations[activityId] || (state.registrations[activityId] = []); }

function filledCount(activity){
  const list = regsOf(activity.id);
  // count registrants who filled in at least one field with a non-empty value
  return list.filter(r => (activity.fields||[]).some(f => norm((r.fieldValues||{})[f.key]) !== "")).length;
}

function allKnownNames(){
  const set = new Set();
  Object.values(state.registrations).forEach(list=>{
    (list||[]).forEach(r => set.add(norm(r.name)));

}

function activitiesThisYear(){
  const y = new Date().getFullYear();
  const now = Date.now();

  // 「未發佈」活動不納入查詢／出席率計算。
  // publishAt 為 null 代表立即發佈；只有發佈時間尚未到的活動才排除。
  return state.activities.filter(a => {
    if(new Date(a.date).getFullYear() !== y) return false;

    const publishTs = a.publishAt ? new Date(a.publishAt).getTime() : null;
    if(Number.isFinite(publishTs) && publishTs > now) return false;

    return true;
  });
}

function recentOrOpenActivities(){
  const sevenDaysAgo = Date.now() - 7*24*60*60*1000;
  return state.activities.filter(a=>{
    if(a.hidden) return false;
    const ts = a.publishAt ? new Date(a.publishAt).getTime() : null;
    if(Number.isFinite(ts) && ts > Date.now()) return false;
    return a.open || new Date(a.date).getTime() >= sevenDaysAgo;
  });
}

function annualStats(name){
  const k = keyOf(name);
  const acts = activitiesThisYear();
  let attended = 0;
  const detail = acts.map(a=>{
    const present = regsOf(a.id).some(r => keyOf(r.name) === k);
    if(present) attended++;
    return { activity: a, present };
  });
  const total = acts.length;
  const rate = total === 0 ? 0 : Math.round((attended/total)*1000)/10;
  return { attended, total, rate, detail };
}

function exportAnnualCSV(rows, year){
  const escapeCsv = (v)=>{
    const s=String(v);
    return /[",\n]/.test(s) ? '"' + s.replace(/"/g,'""') + '"' : s;
  };
  let csv="\uFEFF"+["姓名","參加場次","總場次","出席率(%)"].join(",")+"\n";
  rows.forEach(r=>{
    csv += [escapeCsv(r.name),r.attended,r.total,r.rate].join(",")+"\n";
  });
  const blob=new Blob([csv],{type:"text/csv;charset=utf-8;"});
  const url=URL.createObjectURL(blob);
  const a=document.createElement("a");
  a.href=url;
  a.download=`年度出席率總表_${year}.csv`;
  document.body.appendChild(a);
  a.click();
  document.body.removeChild(a);
  URL.revokeObjectURL(url);
}

function formatCountdown(ms){
  const total=Math.max(0,Math.floor(ms/1000));
  const minutes=Math.floor(total/60);
  const seconds=total%60;
  return `${String(minutes).padStart(2,"0")}:${String(seconds).padStart(2,"0")}`;
}

function ensurePublicCountdown(activity){
  if(!activity || !activity.open)return;
  const end=activity.closeAt?new Date(activity.closeAt).getTime():0;
  if(!end || end<=Date.now())return;
  // 公開簽到頁不依賴管理者本機 Map；closeAt 來自資料庫。
  if(typeof renderCountdown==="function") renderCountdown(activity);
}
function renderCountdown(activity){
  const box=document.getElementById("event-countdown");
  if(!box)return;

  const timer=()=>{
    const now=Date.now();

    // 建立活動原本就是從 activity.closeAt 倒數；
    // 二次開啟只在這裡多一個本機 30 秒 deadline，不改原本 CSS。
    const localDeadline=window.v93CountdownDeadlines?.get(String(activity.id))||0;
    const dbDeadline=activity.closeAt?new Date(activity.closeAt).getTime():0;
    const end=localDeadline||dbDeadline;

    if(end && end>now){
      box.classList.add("has-countdown");
      box.classList.remove("no-countdown");

      let span=box.querySelector(".countdown-text");
      if(!span){
        box.innerHTML=`<i data-lucide="timer"></i><span class="countdown-text">${formatCountdown(end-now)}</span>`;
        refreshIcons();
      }else{
        // 舊版寫法的核心：每秒只改數字。
        span.textContent=formatCountdown(end-now);
      }
    }else{
      box.classList.remove("has-countdown");
      box.classList.add("no-countdown");

      if(!box.querySelector("[data-lucide='timer-off']")){
        box.innerHTML=`<i data-lucide="timer-off"></i>`;
        refreshIcons();
      }
    }
  };

  clearInterval(activity._countdownTimer);
  timer();
  activity._countdownTimer=setInterval(timer,1000);
}

function activityStatusClock(activity){
  // 正常建立活動：使用 activity.closeAt。
  // 二次開啟：只額外從本機 deadline 取得 30 秒，不改既有 CSS。
  const localDeadline=window.v93CountdownDeadlines?.get(String(activity.id))||0;
  const dbDeadline=activity.closeAt?new Date(activity.closeAt).getTime():0;
  const end=localDeadline||dbDeadline||null;
  const remaining=end?end-Date.now():0;

  if(activity.open && end && remaining>0){
    return `<div class="activity-status-clock countdown" data-countdown-end="${end}" aria-label="剩餘 ${formatCountdown(remaining)}"><i data-lucide="timer"></i><span class="countdown-text">${formatCountdown(remaining)}</span></div>`;
  }
  if(activity.open) return `<div class="activity-status-clock open" aria-label="開放中"><i data-lucide="check"></i></div>`;
  return `<div class="activity-status-clock closed" aria-label="已關閉"></div>`;
}

let activityExpiryTimer=null;
window.v93CountdownDeadlines=window.v93CountdownDeadlines||new Map();

function startActivityExpiryWatcher(){
  if(activityExpiryTimer)clearInterval(activityExpiryTimer);
  activityExpiryTimer=setInterval(async()=>{
    if(!Array.isArray(state.activities))return;
    const now=Date.now();
    const expired=state.activities.filter(a=>{
      const localEnd=window.v93CountdownDeadlines?.get(String(a.id))||0;
      const dbEnd=a.closeAt?new Date(a.closeAt).getTime():0;
      const end=localEnd||dbEnd;
      return a.open && end && end<=now;
    });
    if(!expired.length)return;

    for(const a of expired){
      // 先保留活動資料，使用目前已驗證可正常工作的 update RPC 關閉。
      const oldCloseAt=a.closeAt;
      const oldAuto=a.autoCloseMinutes;
      const localDeadline=window.v93CountdownDeadlines?.get(String(a.id))||0;
      a.open=false;
      a.closeAt=null;
      a.autoCloseMinutes=0;
      window.v93CountdownDeadlines?.delete(String(a.id));

      try{
        await updateActivityRemote({
          id:a.id,
          name:a.name,
          date:a.date,
          fields:a.fields||[],
          open:false,
          maxParticipants:a.maxParticipants==null?null:a.maxParticipants,
          createdBy:a.createdBy||"",
          closeAt:null,
          autoCloseMinutes:0,
          hidden:!!a.hidden,
          publishAt:a.publishAt||null
        });
        console.log("[活動管理] 30 秒到，自動關閉活動",a.name);
      }catch(e){
        // 更新失敗時恢復本機狀態，避免畫面與資料庫不一致。
        a.open=true;
        a.closeAt=oldCloseAt;
        a.autoCloseMinutes=oldAuto;
        if(localDeadline) window.v93CountdownDeadlines?.set(String(a.id),localDeadline);
        console.error("[活動管理] 30 秒自動關閉失敗",e);
      }
    }

    // 倒數每秒只更新既有數字，不重建整個頁面。
    // 只有真的到 0 秒並成功關閉活動後，才需要 render 一次。
    if(expired.length===0 && typeof window.refreshActivityListClocks==="function"){
      window.refreshActivityListClocks();
    }
  },1000);
}

function refreshActivityListClocks(){
  const now=Date.now();

  document.querySelectorAll(".publish-countdown").forEach(box=>{
    const publishAt=new Date(box.dataset.publishAt||"").getTime();
    if(!Number.isFinite(publishAt)) return;
    const remaining=publishAt-now;
    if(remaining>0){
      box.textContent=`距離發佈 ${formatCountdown(remaining)}`;
    }else{
      box.textContent="即將發佈";
    }
  });

  document.querySelectorAll(".activity-status-clock.countdown").forEach(box=>{
    const id=box.closest(".activity-card")?.dataset.open;
    const mapped=window.v93CountdownDeadlines?.get(String(id));
    const dbEnd=Number(box.dataset.countdownEnd||0);
    const end=dbEnd||mapped;
    const remaining=end-now;
    if(remaining<=0)return;

    const span=box.querySelector(".countdown-text");
    if(span)span.textContent=formatCountdown(remaining);
  });

  const eventBox=document.getElementById("event-countdown");
  if(eventBox && openEventId){
    const activity=state.activities.find(x=>String(x.id)===String(openEventId));
    if(activity && activity.open){
      const mapped=window.v93CountdownDeadlines?.get(String(activity.id));
      const end=mapped||(activity.closeAt?new Date(activity.closeAt).getTime():0);
      if(end && end>now){
        const span=eventBox.querySelector(".countdown-text");
        if(span)span.textContent=formatCountdown(end-now);
      }
    }
  }
}


window.refreshActivityListClocks=refreshActivityListClocks;

function getAttendanceTone(rate){
  const n=Number(rate)||0;
  if(n<60) return {name:'red',color:'#DC2626',label:'需要加油'};
  if(n<80) return {name:'orange',color:'#EA580C',label:'持續努力'};
  if(n<90) return {name:'blue',color:'#2563EB',label:'表現良好'};
  return {name:'green',color:'#16A34A',label:'表現優異'};
}

function activityAdminRow(a,hidden=false){
  const list=regsOf(a.id);

  const future=a.publishAt&&Number.isFinite(new Date(a.publishAt).getTime())&&new Date(a.publishAt).getTime()>Date.now();
  let detail="";
  if(expanded){
    const rows=list.map((r,i)=>{
      const fieldCells=(a.fields||[]).map(f=>`<td>${r.fieldValues&&r.fieldValues[f.key]?escapeHtml(r.fieldValues[f.key]):"—"}</td>`).join("");
      return `<tr><td>${i+1}</td><td class="name">${escapeHtml(r.name)}</td>${fieldCells}<td>${r.ts?new Date(r.ts).toLocaleString("zh-TW",{hour12:false}):"—"}</td></tr>`;
    }).join("");
    const headers=(a.fields||[]).map(f=>`<th>${escapeHtml(f.label)}</th>`).join("");

  }
  const statusClass=future?"future":(a.open?"open":"closed");
  const statusText=future?"未發佈":(a.open?"開放中":"已停止");
  return `<div class="activity-admin-card ${hidden?"hidden":""}" data-admin-activity-row="${escapeHtml(a.id)}"><div class="admin-card-top"><div class="admin-card-icon"><i data-lucide="calendar-days"></i></div><div class="admin-card-info"><div class="admin-card-name">${escapeHtml(a.name)}</div><div class="admin-card-meta">${fmtDate(a.date)} · 建立者：${escapeHtml(a.createdBy||"—")}</div><div class="admin-card-status"><span class="status ${statusClass}"><span class="dot"></span>${statusText}</span>${future?` <span class="publish-countdown" data-publish-countdown="${escapeHtml(a.id)}" data-publish-at="${escapeHtml(a.publishAt)}">距離發佈 ${formatCountdown(new Date(a.publishAt).getTime()-Date.now())}</span>`:""}${hidden?` <span class="status closed"><i data-lucide="eye-off"></i> 已隱藏</span>`:""}</div></div><div style="font-size:12px;font-weight:850">${list.length}${a.maxParticipants?` / ${a.maxParticipants}`:""}</div></div><div class="stat-row"><span><b>${list.length}</b> 人簽到</span><span>${a.maxParticipants?`上限 ${a.maxParticipants} 人`:"無人數限制"}</span></div><div class="admin-actions"><button data-admin-attendance="${escapeHtml(a.id)}"><i data-lucide="users"></i>${expanded?"收起名單":`名單 ${list.length}`}</button><button class="activity-toggle-btn ${a.open?"is-on":"is-off"}" data-activity-close="${escapeHtml(a.id)}" aria-label="${a.open?"關閉活動":"開啟活動"}"><i data-lucide="${a.open?"toggle-right":"toggle-left"}"></i><span>${a.open?"開放中":"已停止"}</span></button><button data-activity-hide="${escapeHtml(a.id)}"><i data-lucide="${hidden?"eye":"eye-off"}"></i>${hidden?"取消隱藏":"隱藏"}</button><button class="danger" data-activity-delete="${escapeHtml(a.id)}"><i data-lucide="trash-2"></i>刪除</button></div>${detail}</div>`;
}

function safeQuerySelectorAll(root, selector){
  if(!root || !selector || !String(selector).trim()) return [];
  try{return root.querySelectorAll(selector);}catch(e){

    return [];
  }
}

      ev.preventDefault();

      const id=btn.getAttribute("data-admin-attendance");
      window.adminAttendanceExpandedId =
        window.adminAttendanceExpandedId===id ? null : id;

      // 若目前 state 沒有該活動的簽到資料，重新載入一次。
      const a=state.activities.find(x=>String(x.id)===String(id));
      if(a && (!state.registrations[a.id] || state.registrations[a.id].length===0)){
        try{
          await loadData();
        }catch(e){
          console.error("讀取簽到名單失敗",e);
        }
      }
      renderAdmin(el);
    };
  });

}

function renderAdminLock(el){
  el.innerHTML=`
    <div class="admin-login-page">
      <div class="admin-login-card">
        <div class="admin-login-heading">
          <div class="admin-login-heading-icon">
            <i data-lucide="shield"></i>
          </div>
          <h1>管理者登入</h1>
        </div>

        <div class="field">
          <label class="field-label" for="admin-username">帳號</label>
          <input type="text" id="admin-username" placeholder="請輸入帳號" autocomplete="username">
        </div>

        <div class="field">
          <label class="field-label" for="admin-password">密碼</label>
          <div class="admin-password-wrap">
            <input type="password" id="admin-password" placeholder="請輸入密碼" autocomplete="current-password">
            <button type="button" class="admin-password-toggle" id="admin-password-toggle" aria-label="顯示密碼" title="顯示密碼">
              <i data-lucide="eye"></i>
            </button>
          </div>
        </div>

        <button class="primary admin-login-button" id="admin-login-btn" type="button">
          <i data-lucide="log-in"></i>
          登入
        </button>
      </div>
    </div>
  `;

  const b=document.getElementById("admin-login-btn");
  const u=document.getElementById("admin-username");
  const p=document.getElementById("admin-password");
  const toggle=document.getElementById("admin-password-toggle");

  const login=async()=>{
    if(!norm(u?.value||"")){
      showToast("請輸入帳號");
      u?.focus();
      return;
    }
    if(!p?.value){
      showToast("請輸入密碼");
      p?.focus();
      return;
    }
    if(b)b.disabled=true;
    try{
      await adminLogin(norm(u.value),p.value);
      showToast("登入成功");
      render();
    }catch(e){
      showToast("登入失敗："+(e?.message||"帳號或密碼錯誤"));
      if(b)b.disabled=false;
    }
  };

  b?.addEventListener("click",login);
  [u,p].filter(Boolean).forEach(x=>x.addEventListener("keydown",e=>{
    if(e.key==="Enter")login();
  }));

  toggle?.addEventListener("click",()=>{
    const visible=p.type==="text";
    p.type=visible?"password":"text";
    toggle.innerHTML=`<i data-lucide="${visible?"eye":"eye-off"}"></i>`;
    toggle.setAttribute("aria-label",visible?"顯示密碼":"隱藏密碼");
    toggle.setAttribute("title",visible?"顯示密碼":"隱藏密碼");
    refreshIcons();
  });

  refreshIcons();
}

async function init(){
  render();
  await checkAdminSession();
  await loadData();
  try{ await loadAnnouncementRemote(); }
  catch(e){ console.error("公告載入失敗",e); }
  render();
  setInterval(async ()=>{
    // 任何輸入框正在使用時，禁止背景資料刷新／DOM 重建。
    // 30 秒倒數本身不需要 render，只有真的到 0 秒才重建一次。
    const active=document.activeElement;
    const fieldFocused=!!active && (
      active.tagName==="INPUT" ||
      active.tagName==="TEXTAREA" ||
      active.tagName==="SELECT"
    );
    if(activeTab === 'query' || (activeTab === "admin" && adminPage === "create")) return;

    // 自動關閉計時器：到時間後將活動設為停止簽到
    const now = Date.now();
    // 原本建立活動的 close_at 自動關閉保留。
    // 「重新開啟 30 秒」由 startActivityExpiryWatcher 單獨處理，
    // 避免 loadData 每 6 秒把本機 30 秒 deadline 洗掉。
    const expired = state.activities.filter(a =>
      a.open &&
      a.closeAt &&
      !window.v93CountdownDeadlines?.has(String(a.id)) &&
      new Date(a.closeAt).getTime() <= now
    );

    for(const a of expired){
      try{
        a.open = false;
        await updateActivityRemote(a);
      }catch(e){
        console.error("活動自動關閉失敗", e);
        a.open = true;
      }
    }

    if(activeTab !== "admin"){
      await loadData();
      if(!userIsTyping) renderTab();
      if(openEventId){
        const publicActivity=state.activities.find(x=>String(x.id)===String(openEventId));
        if(publicActivity) ensurePublicCountdown(publicActivity);
      }
    }else if(!userIsTyping){
      // 管理者頁面不重繪，避免建立活動中的輸入資料被清空。
      await loadData();
    }
  },6000);
  refreshActivityListClocks();
setInterval(refreshActivityListClocks,1000);
}

init();

function showRuntimeError(title,reason){
 var b=document.getElementById("runtime-debug"),x=document.getElementById("runtime-debug-text");
 if(b&&x){b.style.display="block";x.textContent=title+"："+String(reason&&reason.message||reason||"未知錯誤")+(reason&&reason.stack?"\n\n"+reason.stack:"");}
}

<script>
/* ===== 活動管理最終除錯層 ===== */
(function(){
  async function activityButtonHandler(ev){
    const btn=ev.target && ev.target.closest &&
      ev.target.closest("[data-activity-close],[data-activity-hide],[data-activity-delete]");
    if(!btn) return;
    ev.preventDefault();
    ev.stopPropagation();

    const id=btn.getAttribute("data-activity-close") ||
             btn.getAttribute("data-activity-hide") ||
             btn.getAttribute("data-activity-delete");

    console.log("[活動管理] 按鈕被點擊", {
      id:id,
      close:btn.getAttribute("data-activity-close"),
      hide:btn.getAttribute("data-activity-hide"),
      delete:btn.getAttribute("data-activity-delete")
    });

    let a=(window.state && Array.isArray(state.activities))
      ? state.activities.find(x=>String(x.id)===String(id))
      : null;

    // state 可能因頁面重繪尚未同步；直接以按鈕上的 UUID 查資料庫。
    if(!a){
      try{
        const {data:remoteActivity,error:remoteError}=await supabaseClient
          .from("activities")
          .select("*")
          .eq("id",id)
          .maybeSingle();

        if(remoteError) throw remoteError;

        if(remoteActivity){
          a={
            id:remoteActivity.id,
            name:remoteActivity.name,
            date:remoteActivity.date,
            fields:Array.isArray(remoteActivity.fields)?remoteActivity.fields:[],
            open:!!remoteActivity.open,
            maxParticipants:remoteActivity.max_participants==null?null:Number(remoteActivity.max_participants),
            createdBy:remoteActivity.created_by||"",
            closeAt:remoteActivity.close_at||null,
            autoCloseMinutes:remoteActivity.auto_close_minutes==null?0:Number(remoteActivity.auto_close_minutes),
            hidden:!!remoteActivity.hidden,
            publishAt:remoteActivity.publish_at||null
          };

          if(window.state){
            window.state.activities=Array.isArray(window.state.activities)?window.state.activities:[];
            const idx=window.state.activities.findIndex(x=>String(x.id)===String(id));
            if(idx>=0) window.state.activities[idx]=a;
            else window.state.activities.push(a);
          }
        }
      }catch(dbErr){
        console.error("[活動管理] 直接查詢活動失敗",dbErr);
        window.showToast("讀取活動失敗："+(dbErr.message||dbErr),"error");
        return;
      }
    }

    if(!a){
      window.showToast("資料庫找不到此活動："+id,"error");
      console.error("[活動管理] 資料庫也找不到活動",id);
      return;
    }

    if(btn.hasAttribute("data-activity-close")){
      activityActionClose(a,btn);
    }else if(btn.hasAttribute("data-activity-hide")){
      activityActionHide(a,btn);
    }else{
      activityActionDelete(a,btn);
    }
  }

  async function activityActionClose(a,btn){
    const next=!a.open;
    if(!confirm(next?"確定開啟「"+a.name+"」？":"確定關閉「"+a.name+"」？")) return;

    btn.disabled=true;
    const oldOpen=a.open;
    const oldCloseAt=a.closeAt;
    const oldAuto=a.autoCloseMinutes;

    try{
      if(next){
        // 第一次 RPC：只負責把活動正常開啟。
        a.open=true;
        a.closeAt=null;
        a.autoCloseMinutes=0;
        await window.updateActivityRemote(a);

        // 第二階段：30 秒只使用 closeAt 作為共享截止時間。
        // 不再送 0.5 分鐘，避免資料庫若為 integer 造成 22P02。
        const deadline=Date.now()+30000;
        const sharedCloseAt=new Date(deadline).toISOString();

        const sharedActivity={
          ...a,
          open:true,
          closeAt:sharedCloseAt,
          autoCloseMinutes:0
        };

        // 將同一個絕對時間寫入 DB；所有手機／電腦都從 close_at 讀取。
        await window.updateActivityRemote(sharedActivity);

        a.closeAt=sharedCloseAt;
        a.autoCloseMinutes=0;
        window.v93CountdownDeadlines.set(String(a.id),deadline);

        // 更新本機 state，但不重新 loadData，避免輸入框／倒數被重建。
        if(window.state && Array.isArray(window.state.activities)){
          const local=window.state.activities.find(x=>String(x.id)===String(a.id));
          if(local){
            local.open=true;
            local.closeAt=sharedCloseAt;
            local.autoCloseMinutes=0;
          }
        }

        window.showToast("活動已開啟，30 秒後關閉簽到");
      }else{
        a.open=false;
        a.closeAt=null;
        a.autoCloseMinutes=0;
        await window.updateActivityRemote(a);

        window.v93CountdownDeadlines.delete(String(a.id));
        window.showToast("活動已關閉");
      }

      if(typeof renderAdmin==="function"){
        const tab=document.getElementById("tab-content");
        if(tab) window.renderAdmin(tab);
      }
      btn.disabled=false;
      if(typeof window.refreshActivityListClocks==="function"){
        window.refreshActivityListClocks();
      }
      if(typeof refreshIcons==="function") refreshIcons();

    }catch(e){
      console.error("[活動管理] 開啟／關閉失敗",e);
      a.open=oldOpen;
      a.closeAt=oldCloseAt;
      a.autoCloseMinutes=oldAuto;
      window.v93CountdownDeadlines.delete(String(a.id));
      window.showToast("活動更新失敗："+(e.message||e),"error");
      btn.disabled=false;
    }
  }
  async function activityActionHide(a,btn){
    const next=!a.hidden;
    if(!confirm(next?"確定隱藏「"+a.name+"」？":"確定取消隱藏「"+a.name+"」？")) return;
    btn.disabled=true;
    const old=!!a.hidden;
    a.hidden=next;
    try{
      await window.updateActivityRemote(a);
      window.showToast(next?"活動已隱藏":"已取消隱藏");
      await window.loadData();
      if(typeof renderAdmin==="function") window.renderAdmin(document.getElementById("tab-content"));
    }catch(e){
      a.hidden=old;
      console.error("[活動管理] 隱藏失敗",e);
      window.showToast("隱藏更新失敗："+(e.message||e),"error");
      btn.disabled=false;
    }
  }

  async function activityActionDelete(a,btn){
    if(!confirm("確定永久刪除「"+a.name+"」？\n此活動的簽到資料也會刪除，無法復原。")) return;
    btn.disabled=true;
    try{
      await window.deleteActivityRemote(a.id);
      window.state.activities=window.state.activities.filter(x=>String(x.id)!==String(a.id));
      delete window.state.registrations[a.id];
      window.showToast("活動已刪除");
      await window.loadData();
      if(typeof renderAdmin==="function") window.renderAdmin(document.getElementById("tab-content"));
    }catch(e){
      console.error("[活動管理] 刪除失敗",e);
      window.showToast("刪除失敗："+(e.message||e),"error");
      btn.disabled=false;
    }
  }

  document.addEventListener("click",async(ev)=>{
    const btn=ev.target.closest("[data-admin-edit-registration]");
    if(!btn) return;
    ev.preventDefault();
    ev.stopPropagation();
    const activityId=btn.getAttribute("data-activity-id");
    const registrationId=btn.getAttribute("data-registration-id");
    const a=state.activities.find(x=>String(x.id)===String(activityId));
    if(!a || !a.open){
      showToast("活動已關閉，無法修改名單");
      return;
    }
    const r=(state.registrations[a.id]||[]).find(x=>String(x.id)===String(registrationId));
    if(!r) return;
    const name=prompt("修改姓名",r.name||"");
    if(name===null) return;
    const clean=norm(name);
    if(!clean){ showToast("姓名不可空白"); return; }
    try{
      await renameRegistrationRemote(registrationId,clean);
      await loadData();
      renderAdmin(document.getElementById("tab-content"));
      showToast("已修改簽到資料");
    }catch(e){
      console.error("修改簽到失敗",e);
      showToast("修改失敗："+(e?.message||e),"error");
    }
  },true);

  // capture=true：在任何其他 click handler 前攔截活動按鈕。
  document.addEventListener("click",activityButtonHandler,true);
})();
</script>
